name: gate

# This repository as a caller like any other: one job, no inputs.
#
# One difference, and it is deliberate. Every other repository pins the central
# workflow to an exact version. This one calls the workflow at its own commit,
# so a change to the pipeline is checked by the pipeline it changes — a broken
# one fails its own pull request instead of everyone else's.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nebensound:
    uses: $/.github/workflows/nebensound.yml
    permissions:
      contents: read

  # TEMPORARY, evidence for #72; reverted before the pull request is merged.
  setup-evidence:
    name: setup evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the tool
        shell: bash
        working-directory: tools/nebensound
        run: |
          set -euo pipefail
          rustup toolchain install
          cargo build --release --locked
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: What the runner has
        shell: bash
        run: |
          uname -a
          for program in node python3 python jq curl; do
            if command -v "$program"; then
              "$program" --version 2>&1 | head -n 1
            else
              echo "$program: not on the PATH"
            fi
          done

      - name: nebensound setup --check, before
        shell: bash
        run: |
          status=0
          nebensound setup --check || status=$?
          echo "exit code $status"

      - name: No terminal, no --with-runtimes, no runtime on the PATH
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -u
          bare="$RUNNER_TEMP/bare"
          mkdir -p "$bare" "$RUNNER_TEMP/home"
          ln -s "$(command -v git)" "$bare/git"
          ln -s "$(command -v curl)" "$bare/curl"
          status=0
          env PATH="$bare" HOME="$RUNNER_TEMP/home" XDG_CACHE_HOME= \
            nebensound setup --pinned < /dev/null || status=$?
          echo "exit code $status"
          echo "What the home folder holds afterwards:"
          find "$RUNNER_TEMP/home"
          test "$status" -eq 1

      - name: nebensound setup --pinned
        shell: bash
        run: nebensound setup --pinned < /dev/null

      - name: nebensound setup --check, after
        shell: bash
        run: nebensound setup --check

      - name: --pinned --with-runtimes, no runtime on the PATH
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bare="$RUNNER_TEMP/bare"
          mkdir -p "$RUNNER_TEMP/home2"
          env PATH="$bare" HOME="$RUNNER_TEMP/home2" XDG_CACHE_HOME= \
            nebensound setup --pinned --with-runtimes < /dev/null
          env PATH="$bare" HOME="$RUNNER_TEMP/home2" XDG_CACHE_HOME= \
            nebensound setup --check
