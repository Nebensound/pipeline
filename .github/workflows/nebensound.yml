name: nebensound

# The one workflow a repository calls. No inputs: what the repository is stands
# in its .nebensound/repo.toml.
#
# Phase 0 (Declare), the versions (Version), the checks (Check), the builds
# (Build) and, after a push to main, the release stage on main (Publish).
#
# The caller starts it on a pull request (opened, synchronize, reopened and
# edited) and on a push to main, pre or pre-*. A run of `edited` is a run like
# any other: every job runs, since a ruleset counts a skipped required check as
# passed.
#
# The caller's job grants contents: write, pull-requests: read,
# id-token: write, packages: write, attestations: write and
# deployments: write; the caller itself keeps contents: read. Every job here
# asks only for what it needs, and a permission no built job needs is asked
# for by none. The list is wider than today's jobs because a called workflow
# never gets more than its caller grants, and a job that asks for more keeps
# every run of that caller from starting: a permission added later would mean
# a change in every repository, while one granted too much can be taken out
# later without breaking a caller.

on:
  workflow_call:

# A push to a pre-branch, `pre` or `pre-*`. Versions and pre-releases of
# pre-branches are not built yet, so such a run checks the commit as a run on
# main does, resolves no version, builds nothing and publishes nothing, and
# says so. The tool knows no branch: it reads the first-parent line of HEAD as
# the line of main. The workflow therefore leaves out what would read the
# versions of that line as main's: the table of Version and the builds.
env:
  NEBENSOUND_PRE_BRANCH: >-
    ${{ github.event_name == 'push'
    && (github.ref == 'refs/heads/pre' || startsWith(github.ref, 'refs/heads/pre-')) }}

# Here and not at the caller, so that it reads the same in every repository.
#
# The event decides. A run of a pull request has the group of its pull request,
# and a newer run of it, after a push or an edit of its title or description,
# cancels the run in progress: only its newest state counts. Every other run, a
# run after a push to main or to a pre-branch, joins the one group of the
# repository: nothing in it is cancelled, and every waiting run keeps its place
# (`queue: max`) instead of being replaced by the next one, so that the
# releases of two merges are published in the order of their pushes and no
# release stops halfway. GitHub refuses `queue: max`
# together with `cancel-in-progress: true`, so the queue follows the event as
# well.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('nebensound-{0}-{1}', github.repository, github.ref)
    || format('nebensound-{0}', github.repository) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

permissions:
  contents: read

jobs:
  declare:
    name: Declare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      units: ${{ steps.units.outputs.units }}
      builds: ${{ steps.builds.outputs.builds }}
      # The whole plan, for what needs the versions in a job whose checkout
      # holds no history: the version writers.
      plan: ${{ steps.phase0.outputs.plan }}

    steps:
      # The whole history, every branch and every tag: phase 0 reads the
      # version of every unit from them, and a shallow clone is an error.
      - name: Check out the calling repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # `$/` is this repository at the commit that is running. The caller pins
      # this workflow to an exact version; everything below it comes from that
      # same commit, and no second version stands in here to fall behind.
      #
      # The tool is built here once and kept in the cache, from which every
      # unit job below takes it.
      - name: Get the tool
        uses: $/.github/actions/tool

      - name: Run phase 0
        id: phase0
        uses: $/.github/actions/phase0

      # A matrix cannot leave out an entry, and a unit that runs no check
      # would get a job with nothing in it. So only the units with a check go
      # on.
      - name: Name the units that run a check
        id: units
        env:
          PLAN: ${{ steps.phase0.outputs.plan }}
        run: |
          set -euo pipefail
          units="$(jq --compact-output '[.units[] | select(.checks | length > 0)]' <<< "$PLAN")"
          jq . <<< "$units"
          echo "units=$units" >> "$GITHUB_OUTPUT"

      # The same for the builds: only the units that build in this run go on,
      # each with the version writers it selects, which write its version
      # before it builds. A unit that builds carries a version, so it stands
      # under `versions` as well, and it builds only when the plan gives it a
      # version of this run. A unit the commit does not touch has no new
      # artifact to hand on, also where the writer gives it its current
      # version for a package that depends on it. After a push to a
      # pre-branch no unit builds: the run resolves no version of its own.
      - name: Name the units that build
        id: builds
        env:
          PLAN: ${{ steps.phase0.outputs.plan }}
        run: |
          set -euo pipefail
          if [ "${NEBENSOUND_PRE_BRANCH:-false}" = "true" ]; then
            echo "A push to a pre-branch resolves no version, so no unit builds."
            echo "builds=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          builds="$(jq --compact-output '
            .versions as $versions
            | [ .units[] | select(.build != null) | . as $unit
                | first($versions[]
                    | select(.kind == $unit.kind and .name == $unit.name)) as $version
                | select($version.version != null)
                | . + { writers: $version.writers } ]' <<< "$PLAN")"
          jq . <<< "$builds"
          echo "builds=$builds" >> "$GITHUB_OUTPUT"

  # The version of every unit that carries one, as a table in the summary of
  # the run, and after a push to a pre-branch the sentence why there is none.
  # It writes nothing and tags nothing: it reports. It runs whatever Declare's
  # result, so that an error in the history fails it with the finding instead
  # of leaving it skipped; it only waits for Declare to take the tool from the
  # cache Declare filled. A cancelled run, for instance one of a pull request
  # that a newer push to it replaced, skips it.
  version:
    name: Version
    needs: declare
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # As in Declare: the whole history, every branch and every tag.
      - name: Check out the calling repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get the tool
        uses: $/.github/actions/tool

      # On a pull request the checkout is the merge commit GitHub builds for
      # it, and the tool reads it as the squash merge would put it on the base
      # branch, with the title and description as its message. The version
      # shown is the one that merge would get, with -pr.<number> behind it.
      # The text goes in through the environment, never into the script.
      #
      # After a push to a pre-branch no version is resolved: the tool would
      # read the branch's own commits as commits of main and give them full
      # versions that main never gives. The step says so instead, as a notice
      # and as a line in the summary of the run.
      - name: Report the versions
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${NEBENSOUND_PRE_BRANCH:-false}" = "true" ]; then
            line="This run follows a push to the pre-branch \`$BRANCH\`. Versions and pre-releases of pre-branches are not built yet, so no version is resolved, nothing is built and nothing is published."
            # A branch name holds no line break, but it may hold `%`, which a
            # workflow command reads as the start of an escape.
            echo "::notice title=Pre-branch::${line//%/%25}"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          call=(nebensound-repo -C "$GITHUB_WORKSPACE" version)
          if [ -n "$NUMBER" ]; then
            message="$TITLE"
            if [ -n "$BODY" ]; then
              message="$(printf '%s\n\n%s' "$TITLE" "$BODY")"
            fi
            # One argument with "=", so that a title starting with "-" stays
            # the message and is not read as an option.
            call+=(--pull-request "$NUMBER" "--message=$message")
          fi
          # The text table into the log, the Markdown table into the summary.
          # When phase 0 found errors both say which, and the step fails.
          status=0
          "${call[@]}" || status=$?
          "${call[@]}" --markdown >> "$GITHUB_STEP_SUMMARY" || status=$?
          exit "$status"

  # One job per unit, as the plan of phase 0 names them, and in it one step per
  # check the unit runs. Each building block asks the tool which files its
  # check covers in the unit, less what `[[exclude]]` takes out, and checks
  # exactly those; the list does not travel through a job output, which is
  # limited in size. `uses:` takes no expression, so every building block is
  # named here and switched by the check it implements:
  #
  #   - name: <check>
  #     if: ${{ !cancelled() && contains(matrix.checks, '<check>') }}
  #     uses: $/.github/actions/check-<check>
  #     with:
  #       working-directory: ${{ matrix.path }}
  #
  # A check that writes the versions before it tests a package also gets
  # `plan: ${{ needs.declare.outputs.plan }}`, and nothing else.
  #
  # Every step runs after a failing one, so that one run shows every finding of
  # the unit. Each building block adds its step below and its name to the list
  # `WRITTEN_CHECKS` in "Not written yet"; `cargo xtask check` fails until the
  # register, the blocks and these steps agree.
  units:
    name: >-
      ${{ matrix.kind == 'repository' && 'Check repository'
      || format('Check component {0}', matrix.name) }}
    needs: declare
    if: needs.declare.outputs.units != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.declare.outputs.units) }}

    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # From the cache `Declare` filled; built here only when it misses.
      - name: Get the tool
        uses: $/.github/actions/tool

      # A check the register knows and nobody has written yet. It fails by
      # name, so that a pull request says what is missing instead of passing
      # without anyone having looked. It stands first, so that it is the first
      # thing read; the checks that are written still run.
      - name: Not written yet
        env:
          CHECKS: ${{ toJSON(matrix.checks) }}
          WRITTEN_CHECKS: '["css", "dockerfile", "html", "json", "markdown", "python", "rust", "toml", "yaml"]'
          UNIT_PATH: ${{ matrix.path }}
        run: |
          set -euo pipefail
          missing="$(jq --raw-output --null-input \
            --argjson checks "$CHECKS" --argjson written "$WRITTEN_CHECKS" \
            '($checks - $written)[]')"
          if [ -z "$missing" ]; then
            echo "Every check of '$UNIT_PATH' has a building block."
            exit 0
          fi
          while IFS= read -r check; do
            echo "::error::The check '$check' has no building block yet, so '$UNIT_PATH' is not checked for it. It is to be written under .github/actions/check-$check."
          done <<< "$missing"
          exit 1

      - name: css
        if: ${{ !cancelled() && contains(matrix.checks, 'css') }}
        uses: $/.github/actions/check-css
        with:
          working-directory: ${{ matrix.path }}

      - name: dockerfile
        if: ${{ !cancelled() && contains(matrix.checks, 'dockerfile') }}
        uses: $/.github/actions/check-dockerfile
        with:
          working-directory: ${{ matrix.path }}

      - name: html
        if: ${{ !cancelled() && contains(matrix.checks, 'html') }}
        uses: $/.github/actions/check-html
        with:
          working-directory: ${{ matrix.path }}

      - name: json
        if: ${{ !cancelled() && contains(matrix.checks, 'json') }}
        uses: $/.github/actions/check-json
        with:
          working-directory: ${{ matrix.path }}

      - name: markdown
        if: ${{ !cancelled() && contains(matrix.checks, 'markdown') }}
        uses: $/.github/actions/check-markdown
        with:
          working-directory: ${{ matrix.path }}

      - name: python
        if: ${{ !cancelled() && contains(matrix.checks, 'python') }}
        uses: $/.github/actions/check-python
        with:
          working-directory: ${{ matrix.path }}

      - name: rust
        if: ${{ !cancelled() && contains(matrix.checks, 'rust') }}
        uses: $/.github/actions/check-rust
        with:
          working-directory: ${{ matrix.path }}
          plan: ${{ needs.declare.outputs.plan }}

      - name: toml
        if: ${{ !cancelled() && contains(matrix.checks, 'toml') }}
        uses: $/.github/actions/check-toml
        with:
          working-directory: ${{ matrix.path }}

      - name: yaml
        if: ${{ !cancelled() && contains(matrix.checks, 'yaml') }}
        uses: $/.github/actions/check-yaml
        with:
          working-directory: ${{ matrix.path }}

      # The repository's own checks, as its xtask runs them: the last step of
      # `Check repository`, so that they are as mandatory as the register's
      # without a workflow or a ruleset entry of their own. Without
      # xtask/Cargo.toml the step is skipped and nothing else changes.
      #
      # The toolchain is the one the xtask pins: the rust-toolchain.toml in
      # xtask/, else the one in the repository root. rustup resolves it from
      # xtask/, and the command runs from the root with that toolchain, since
      # the root is where `cargo xtask` is reached. An xtask that pins none
      # fails here rather than running on whatever the runner brings. That the
      # xtask's own code is checked is phase 0's demand: xtask/ needs a unit
      # that runs the rust check, like any other Rust code.
      - name: xtask check --all
        if: >-
          ${{ !cancelled() && matrix.kind == 'repository'
          && hashFiles('xtask/Cargo.toml') != '' }}
        run: |
          set -euo pipefail
          pin=""
          for file in xtask/rust-toolchain.toml xtask/rust-toolchain \
            rust-toolchain.toml rust-toolchain; do
            if [ -f "$file" ]; then
              pin="$file"
              break
            fi
          done
          if [ -z "$pin" ]; then
            echo "::error file=xtask/Cargo.toml::The xtask pins no toolchain: neither xtask/ nor the repository root holds a rust-toolchain.toml."
            exit 1
          fi
          # A top-level command, so that set -e stops the step at a failing
          # install; inside $(...) bash would not.
          (cd xtask && rustup toolchain install)
          toolchain="$(cd xtask && rustup show active-toolchain | cut -d ' ' -f 1)"
          echo "Running the xtask with $toolchain, pinned in $pin."
          export RUSTUP_TOOLCHAIN="$toolchain"
          cargo xtask check --all

  # The one name a ruleset can require. A matrix gives one context per unit,
  # and those names change with the repository; this job gathers them.
  check:
    name: Check
    needs:
      - declare
      - units
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Gather the checks
        env:
          DECLARE: ${{ needs.declare.result }}
          CHECKS: ${{ needs.units.result }}
        run: |
          set -euo pipefail
          if [ "$DECLARE" != "success" ]; then
            echo "::error::Phase 0 did not pass ($DECLARE), so nothing was checked."
            exit 1
          fi
          case "$CHECKS" in
            success)
              echo "Every check the plan started passed."
              ;;
            skipped)
              echo "The plan starts no check here; there was nothing to do."
              ;;
            *)
              echo "::error::At least one check did not pass ($CHECKS)."
              exit 1
              ;;
          esac

      # A version writer the register knows and nobody has written yet, as a
      # check without a building block fails in `Not written yet`: by name, so
      # that a pull request says what is missing. Here, since a writer belongs
      # to a unit that carries a version, not to a unit that runs a check.
      # Each building block `version-<writer>` adds its name to the list.
      - name: Version writers not written yet
        if: ${{ !cancelled() }}
        env:
          PLAN: ${{ needs.declare.outputs.plan }}
          WRITTEN: '["cargo"]'
        run: |
          set -euo pipefail
          if [ -z "$PLAN" ]; then
            echo "There is no plan, so there is no version writer to look at."
            exit 0
          fi
          missing="$(jq --raw-output --argjson written "$WRITTEN" '
            .versions[] | . as $unit | (.writers - $written)[]
            | "\(.)\t\(if $unit.kind == "repository" then "the repository"
                else "component \($unit.name)" end)"' <<< "$PLAN")"
          if [ -z "$missing" ]; then
            echo "Every version writer the plan names has a building block."
            exit 0
          fi
          while IFS=$'\t' read -r writer unit; do
            echo "::error::The version writer '$writer' has no building block yet, so the version of $unit is not written. It is to be written under .github/actions/version-$writer."
          done <<< "$missing"
          exit 1

      # A publish target the register knows and nobody has written yet fails by
      # name, as a version writer without a building block does: here, on the
      # pull request, and not only in Publish once the merge has happened. A
      # target belongs to a unit that carries a version, and every unit that
      # names one fails here, whether the commit touches it or not. Each
      # building block `publish-<target>` adds its target to the list.
      - name: Publish targets not written yet
        if: ${{ !cancelled() }}
        env:
          PLAN: ${{ needs.declare.outputs.plan }}
          WRITTEN: "[]"
        run: |
          set -euo pipefail
          if [ -z "$PLAN" ]; then
            echo "There is no plan, so there is no publish target to look at."
            exit 0
          fi
          missing="$(jq --raw-output --argjson written "$WRITTEN" '
            .versions[] | . as $unit | (.targets - $written)[]
            | "\(.)\t\(if $unit.kind == "repository" then "the repository"
                else "component \($unit.name)" end)"' <<< "$PLAN")"
          if [ -z "$missing" ]; then
            echo "Every publish target the plan names has a building block."
            exit 0
          fi
          while IFS=$'\t' read -r target unit; do
            echo "::error::The publish target '$target' has no building block yet, so $unit is not published there. It is to be written under .github/actions/publish-${target//./-}."
          done <<< "$missing"
          exit 1

  # One job per unit that builds in this run, as Declare names them. Each starts
  # only when Check passed: nothing is built from a tree that failed. The
  # condition names the results itself, since the implicit success() would
  # also skip the builds when `units` was skipped because no unit runs a check.
  #
  # The job first writes the unit's version with each version writer it
  # selects, and then builds. A unit starts one build, so one of the build steps
  # runs, switched by the build it implements. `uses:` takes no expression, so
  # every building block is named here:
  #
  #   - name: <writer>
  #     if: ${{ contains(matrix.writers, '<writer>') }}
  #     uses: $/.github/actions/version-<writer>
  #     with:
  #       plan: ${{ needs.declare.outputs.plan }}
  #
  #   - name: <build>
  #     if: ${{ matrix.build == '<build>' }}
  #     uses: $/.github/actions/build-<build>
  #     with:
  #       working-directory: ${{ matrix.path }}
  #
  # A build that labels what it builds with the unit's version also gets
  # `plan: ${{ needs.declare.outputs.plan }}`, and nothing else.
  #
  # Neither runs after a step that failed: a build from versions that were not
  # written would hand on the wrong artifact. Each build block adds its step
  # below and its name to the list `WRITTEN_BUILDS` in "Not written yet"; a
  # version writer is held by "Version writers not written yet" in Check, which
  # fails before any build starts. `cargo xtask check` fails until the
  # register, the blocks and these steps agree.
  builds:
    name: >-
      ${{ matrix.kind == 'repository' && 'Build repository'
      || format('Build component {0}', matrix.name) }}
    needs:
      - declare
      - check
    if: >-
      ${{ !cancelled()
      && needs.declare.result == 'success'
      && needs.check.result == 'success'
      && needs.declare.outputs.builds != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.declare.outputs.builds) }}

    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # From the cache `Declare` filled; the version writers call it.
      - name: Get the tool
        uses: $/.github/actions/tool

      # A build the register knows and nobody has written yet fails by name, as
      # a check does, so that a pull request says what is missing.
      - name: Not written yet
        env:
          BUILD: ${{ matrix.build }}
          WRITTEN_BUILDS: '["cargo-package", "docker"]'
          UNIT_PATH: ${{ matrix.path }}
        run: |
          set -euo pipefail
          if jq --exit-status --null-input \
            --arg build "$BUILD" --argjson written "$WRITTEN_BUILDS" \
            '$written | index($build) != null' > /dev/null; then
            echo "The build '$BUILD' of '$UNIT_PATH' has a building block."
            exit 0
          fi
          echo "::error::The build '$BUILD' has no building block yet, so '$UNIT_PATH' is not built. It is to be written under .github/actions/build-$BUILD."
          exit 1

      - name: cargo
        if: ${{ contains(matrix.writers, 'cargo') }}
        uses: $/.github/actions/version-cargo
        with:
          plan: ${{ needs.declare.outputs.plan }}

      - name: cargo-package
        if: ${{ matrix.build == 'cargo-package' }}
        uses: $/.github/actions/build-cargo-package
        with:
          working-directory: ${{ matrix.path }}

      - name: docker
        if: ${{ matrix.build == 'docker' }}
        uses: $/.github/actions/build-docker
        with:
          working-directory: ${{ matrix.path }}
          plan: ${{ needs.declare.outputs.plan }}

  # The one name a ruleset can require for the builds, gathered like Check. When
  # nothing builds in this run, as after a push to a pre-branch, it is green and
  # says so, whatever Check found. Otherwise it passes only when Check passed: a
  # build that never started because a check failed is no success.
  build:
    name: Build
    needs:
      - declare
      - check
      - builds
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Gather the builds
        env:
          DECLARE: ${{ needs.declare.result }}
          CHECK: ${{ needs.check.result }}
          BUILDS: ${{ needs.builds.result }}
          PLANNED: ${{ needs.declare.outputs.builds }}
        run: |
          set -euo pipefail
          if [ "$DECLARE" != "success" ]; then
            echo "::error::Phase 0 did not pass ($DECLARE), so nothing was built."
            exit 1
          fi
          if [ "$PLANNED" = "[]" ]; then
            if [ "${NEBENSOUND_PRE_BRANCH:-false}" = "true" ]; then
              echo "Nothing builds in this run: a push to a pre-branch resolves no version."
            else
              echo "Nothing builds in this run: no unit that builds has a version of this run."
            fi
            exit 0
          fi
          if [ "$CHECK" != "success" ]; then
            echo "::error::Check did not pass ($CHECK), so nothing was built."
            exit 1
          fi
          case "$BUILDS" in
            success)
              echo "Every build the plan started passed."
              ;;
            skipped)
              echo "::error::The plan names builds, and none of them ran."
              exit 1
              ;;
            *)
              echo "::error::At least one build did not pass ($BUILDS)."
              exit 1
              ;;
          esac

  # The release stage on main: after a push to main, and only there, never
  # after a push to a pre-branch, every unit the history gives a version of the
  # pushed commit gets its records, a tag on the commit and a GitHub Release, a
  # full one: every merge into main is a full release. What it does, and in
  # which order, is the tool's call `release`; this job only gets the tool and
  # calls it.
  #
  # It starts only when Declare, Check and Build passed. Check is named on its
  # own: Build is green when nothing builds, whatever Check found, and nothing
  # is released from a tree whose checks failed. It is the only job that may
  # write to the repository; every other job, and every job of a pull request,
  # keeps a read token. The run it belongs to waits for its turn in the one
  # group of the repository (see `concurrency`), so its checkout holds every
  # record the runs before it wrote.
  #
  # Nothing another job wrote reaches it, only whether that job passed: it
  # takes no job output and no artifact, it reads the versions from the history
  # itself, and it builds the tool itself, from the source of this commit of
  # the pipeline, without the cache. Every job of a branch may write the cache,
  # a job that runs code of the repository among them, and what such a job
  # left there is not to run with a token that can write.
  publish:
    name: Publish
    needs:
      - declare
      - check
      - build
    if: >-
      ${{ !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.declare.result == 'success'
      && needs.check.result == 'success'
      && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # The whole history and every tag: the versions come from the history,
      # and the records of a unit decide what its release notes list and
      # whether a newer release holds this commit.
      - name: Check out the calling repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get the tool
        uses: $/.github/actions/tool
        with:
          cache: "false"

      # The token goes to this step alone, and the tool hands it to curl on
      # its standard input, never on a command line.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nebensound-repo -C "$GITHUB_WORKSPACE" release
