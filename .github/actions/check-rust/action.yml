name: check-rust
description: >-
  The Rust check over one Cargo workspace: formatting, Clippy, tests in every
  feature mode, documentation, a release build, the oldest supported Rust
  version, full coverage, and every published package built and tested from
  its own contents.

# One input, and it is not a setting: where the workspace is. It comes from the
# plan of phase 0, never from the calling repository. The toolchain is the one
# the workspace pins in its rust-toolchain.toml, and the oldest supported
# version is its `rust-version` — both are read here rather than handed in, so
# that no repository can tell this check to look away.
#
# One step runs elsewhere: coverage is measured on a nightly toolchain pinned
# below, because only there does `#[coverage(off)]` take effect.
#
# The files are the ones `nebensound files` names for the check and the unit:
# the `.rs` files Git tracks below the workspace, less what an `[[exclude]]`
# entry of the declaration takes out. Rust code is excluded by the package,
# never by the file; phase 0 fails on an entry that takes out part of a
# package. A package `nebensound excluded-packages` names is out of every step:
# not formatted, not linted, not tested, not documented, not counted for
# coverage. It is only compiled where another package depends on it, and
# rustc still prints its own warnings for it then, which fail nothing. That
# holds for a workspace member and for a path dependency outside the workspace
# alike. The calling job puts the tool on the PATH first (the action `tool`).

inputs:
  working-directory:
    description: The directory of the Cargo workspace, as the plan names it.
    required: true

runs:
  using: composite
  steps:
    # At the repository root, where the paths the tool names start.
    - name: Find the Rust files
      id: files
      shell: bash
      env:
        UNIT: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        list="$RUNNER_TEMP/check-rust-files"
        excluded="$RUNNER_TEMP/check-rust-excluded.json"
        # The tool writes a refusal where the list would go: into the log
        # with it, or the step fails without saying why.
        if ! nebensound files -z -- rust "$UNIT" > "$list"; then
          cat "$list" >&2
          exit 1
        fi
        if ! nebensound excluded-packages > "$excluded"; then
          cat "$excluded" >&2
          exit 1
        fi
        {
          echo "list=$list"
          echo "excluded=$excluded"
        } >> "$GITHUB_OUTPUT"
        echo "$(tr -cd '\0' < "$list" | wc -c) Rust file(s) to check:"
        tr '\0' '\n' < "$list"

    # A workspace that pulls in a database engine fills a hosted runner before
    # its tests are done. What is removed here is software this check never
    # calls.
    - name: Make room on the runner
      shell: bash
      run: |
        set -euo pipefail
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Install the toolchain the workspace pins
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        rustup toolchain install
        rustup component add rustfmt clippy
        rustc --version

    - name: Cache what Cargo builds
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.working-directory }}

    # Cargo's local packages, the workspace members and the path dependencies
    # wherever they lie, held against the packages `[[exclude]]` takes out. A
    # package is out when its folder lies in an excluded one. What stays is
    # every member not out; what is out is left out of every step below by
    # name (`--exclude`, members only) and by folder (coverage). With all
    # features, so that an optional path dependency is seen as well.
    - name: Find the packages
      id: packages
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EXCLUDED: ${{ steps.files.outputs.excluded }}
      run: |
        set -euo pipefail
        packages="$RUNNER_TEMP/check-rust-packages.json"
        cargo metadata --locked --format-version 1 --all-features \
          | jq --arg root "$(realpath "$GITHUB_WORKSPACE")" --slurpfile out "$EXCLUDED" '
              .workspace_members as $members
              | [ .packages[] | select(.source == null)
                  | .id as $id
                  | (.manifest_path | ltrimstr($root + "/")
                      | if . == "Cargo.toml" then "." else rtrimstr("/Cargo.toml") end) as $dir
                  | { name, dir: $dir, member: any($members[]; . == $id),
                      reason: (first($out[0][]
                        | select(.path as $out
                            | $out == "." or $out == $dir or ($dir | startswith($out + "/")))
                        | .reason) // null) } ]
              | { checked: [ .[] | select(.member and .reason == null) | .name ],
                  excluded: [ .[] | select(.reason != null) ] }' > "$packages"
        echo "json=$packages" >> "$GITHUB_OUTPUT"
        echo "checked=$(jq '.checked | length' "$packages")" >> "$GITHUB_OUTPUT"
        echo "Checked: $(jq -r '.checked | join(", ")' "$packages")"
        jq -r '.excluded[]
          | "Left out of every step, \(if .member then "a member" else "a path dependency" end): \(.name) at \(.dir): \(.reason)"' \
          "$packages"
        if [ "$(jq '.checked | length' "$packages")" -eq 0 ]; then
          echo "Every member of the workspace is excluded, so there is nothing to check."
        fi

    # Only the members that stay: `--all` would take in every path dependency
    # as well, inside the workspace or not. rustfmt names every file that
    # differs on standard output, by its absolute path, and each one fails the
    # step. On standard error it warns without failing (an option the
    # toolchain does not support, say) and reports what keeps it from
    # formatting; a line there that is not a warning fails the step.
    - name: Formatting
      if: steps.packages.outputs.checked != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LIST: ${{ steps.files.outputs.list }}
        PACKAGES: ${{ steps.packages.outputs.json }}
      run: |
        set -euo pipefail
        mapfile -t selected < <(jq -r '.checked[] | "--package=\(.)"' "$PACKAGES")
        status=0
        cargo fmt "${selected[@]}" -- --check --files-with-diff \
          > "$RUNNER_TEMP/check-rust-fmt" 2> "$RUNNER_TEMP/check-rust-fmt-err" \
          || status=$?
        cat "$RUNNER_TEMP/check-rust-fmt-err" >&2
        if [ "$status" -eq 0 ]; then
          echo "Every file is formatted the way cargo fmt writes it."
          exit 0
        fi
        # A file name is a property of the workflow command: escaped, so that
        # a `,` or `:` in it does not cut the name short.
        property() {
          local value="$1"
          value="${value//'%'/'%25'}"
          value="${value//':'/'%3A'}"
          value="${value//','/'%2C'}"
          printf '%s' "$value"
        }
        failed=0
        if grep -qv '^Warning: ' "$RUNNER_TEMP/check-rust-fmt-err"; then
          failed=1
        fi
        # A failure that names no file is one, whatever standard error says.
        if [ ! -s "$RUNNER_TEMP/check-rust-fmt" ]; then
          echo "cargo fmt failed with exit code $status and named no file."
          failed=1
        fi
        while IFS= read -r line; do
          file="${line#"$GITHUB_WORKSPACE"/}"
          if [ "$file" != "$line" ] && grep -qzxF -- "$file" "$LIST"; then
            echo "::error file=$(property "$file")::not formatted the way cargo fmt writes it"
            failed=1
          else
            echo "$line"
            failed=1
          fi
        done < "$RUNNER_TEMP/check-rust-fmt"
        if [ "$failed" -ne 0 ]; then
          # The differences themselves, for the log.
          cargo fmt "${selected[@]}" -- --check || true
        fi
        exit "$failed"

    # Every step from here on leaves out the members that are excluded
    # (`--exclude`). Clippy lints a workspace member it compiles as a
    # dependency of another one all the same, `-D warnings` included, unless it
    # is told `--no-deps`: then it lints only the packages it was asked for.
    # A path dependency outside the workspace it never lints.
    - name: Clippy, all features
      if: steps.packages.outputs.checked != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGES: ${{ steps.packages.outputs.json }}
      run: |
        set -euo pipefail
        mapfile -t without < <(jq -r '.excluded[] | select(.member) | "--exclude=\(.name)"' "$PACKAGES")
        cargo clippy --locked --workspace "${without[@]}" --all-targets --all-features --no-deps \
          -- -D warnings

    - name: Clippy, no default features
      if: steps.packages.outputs.checked != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGES: ${{ steps.packages.outputs.json }}
      run: |
        set -euo pipefail
        mapfile -t without < <(jq -r '.excluded[] | select(.member) | "--exclude=\(.name)"' "$PACKAGES")
        cargo clippy --locked --workspace "${without[@]}" --all-targets --no-default-features \
          --no-deps -- -D warnings

    - name: Tests, all features
      if: steps.packages.outputs.checked != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGES: ${{ steps.packages.outputs.json }}
      run: |
        set -euo pipefail
        mapfile -t without < <(jq -r '.excluded[] | select(.member) | "--exclude=\(.name)"' "$PACKAGES")
        cargo test --locked --workspace "${without[@]}" --all-features
        cargo test --locked --workspace "${without[@]}" --all-features --doc

    - name: Tests, no default features
      if: steps.packages.outputs.checked != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGES: ${{ steps.packages.outputs.json }}
      run: |
        set -euo pipefail
        mapfile -t without < <(jq -r '.excluded[] | select(.member) | "--exclude=\(.name)"' "$PACKAGES")
        cargo test --locked --workspace "${without[@]}" --no-default-features

    - name: Documentation without warnings
      if: steps.packages.outputs.checked != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RUSTDOCFLAGS: -D warnings
        PACKAGES: ${{ steps.packages.outputs.json }}
      run: |
        set -euo pipefail
        mapfile -t without < <(jq -r '.excluded[] | select(.member) | "--exclude=\(.name)"' "$PACKAGES")
        cargo doc --locked --workspace "${without[@]}" --all-features --no-deps

    - name: Release build
      if: steps.packages.outputs.checked != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGES: ${{ steps.packages.outputs.json }}
      run: |
        set -euo pipefail
        mapfile -t without < <(jq -r '.excluded[] | select(.member) | "--exclude=\(.name)"' "$PACKAGES")
        cargo build --locked --workspace "${without[@]}" --all-features --release

    # The oldest `rust-version` any package of the workspace claims that is
    # not excluded. A workspace that claims none has nothing to prove here.
    - name: Oldest supported Rust version
      if: steps.packages.outputs.checked != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGES: ${{ steps.packages.outputs.json }}
      run: |
        set -euo pipefail
        mapfile -t without < <(jq -r '.excluded[] | select(.member) | "--exclude=\(.name)"' "$PACKAGES")
        msrv="$(cargo metadata --locked --format-version 1 --no-deps \
          | jq -r --slurpfile packages "$PACKAGES" '
              [.packages[] | select(.name | IN($packages[0].checked[])) | .rust_version
                | select(. != null)]
              | sort_by(split(".") | map(tonumber)) | first // empty')"
        if [ -z "$msrv" ]; then
          echo "No package claims a rust-version, so there is no oldest version to build with."
          exit 0
        fi
        echo "Building with $msrv, the oldest version a package claims."
        rustup toolchain install "$msrv" --profile minimal
        cargo "+$msrv" build --locked --workspace "${without[@]}" --all-features

    # Both pinned, so that what measures the coverage is the same in every run,
    # and both raised by hand in a pull request of their own.
    #
    # The toolchain is a nightly pinned by date. On a nightly toolchain
    # cargo-llvm-cov sets the cfg `coverage_nightly`, and only there does
    # `#[coverage(off)]` exist. So a workspace marks a function it justifies
    # leaving out with `#[cfg_attr(coverage_nightly, coverage(off))]`, enables
    # the attribute at the crate root with
    # `#![cfg_attr(coverage_nightly, feature(coverage_attribute))]`, declares
    # the cfg in its manifest with
    # `unexpected_cfgs = { level = "...", check-cfg = ["cfg(coverage_nightly)"] }`
    # under `[workspace.lints.rust]` or `[lints.rust]` (otherwise rustc reports
    # every such `cfg_attr` as `unexpected_cfgs`, which Clippy and rustdoc,
    # both run with `-D warnings` here, turn into an error), and builds
    # unchanged on its own toolchain. Every other step runs on that one.
    #
    # The tool is installed from source with its lockfile.
    - name: Coverage tools
      id: coverage-tools
      if: steps.packages.outputs.checked != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOLCHAIN: nightly-2026-11-14
      run: |
        set -euo pipefail
        rustup toolchain install "$TOOLCHAIN" --profile minimal --component llvm-tools-preview
        rustc "+$TOOLCHAIN" --version
        cargo install cargo-llvm-cov --locked --version 0.9.0
        echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

    # An excluded package is not counted, a member or a path dependency:
    # llvm-cov names every file by its absolute path, so each folder is
    # matched as exactly that, from the start.
    - name: Regions, lines and functions are fully covered
      if: steps.packages.outputs.checked != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOLCHAIN: ${{ steps.coverage-tools.outputs.toolchain }}
        PACKAGES: ${{ steps.packages.outputs.json }}
      run: |
        set -euo pipefail
        mapfile -t without < <(jq -r '.excluded[] | select(.member) | "--exclude=\(.name)"' "$PACKAGES")
        root="$(realpath "$GITHUB_WORKSPACE")"
        pattern="$(jq -r --arg root "$root" '
          [.excluded[] | (if .dir == "." then $root else "\($root)/\(.dir)" end)
            | gsub("(?<c>[\\[\\]\\\\.*^$+?(){}|])"; "\\\(.c)")] | join("|")' "$PACKAGES")"
        ignore=()
        if [ -n "$pattern" ]; then
          echo "Not counted: ^($pattern)/"
          ignore=(--ignore-filename-regex "^($pattern)/")
        fi
        cargo "+$TOOLCHAIN" llvm-cov --locked --workspace "${without[@]}" --all-features \
          "${ignore[@]}" --fail-under-lines 100 --fail-under-regions 100 --fail-under-functions 100

    # Only what is published, and not excluded. A package with publish = false
    # has no package anyone could build from the outside, and
    # `cargo package --workspace` fails on it instead of skipping it.
    - name: Each published package builds and tests from its own contents
      if: steps.packages.outputs.checked != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGES: ${{ steps.packages.outputs.json }}
      run: |
        set -euo pipefail
        published="$(cargo metadata --locked --format-version 1 --no-deps \
          | jq -r --slurpfile packages "$PACKAGES" '
              .packages[] | select(.publish != [] and (.name | IN($packages[0].checked[])))
              | .name')"
        if [ -z "$published" ]; then
          echo "Nothing is published from here, so there is nothing to verify."
          exit 0
        fi
        for name in $published; do
          cargo package --locked -p "$name"
        done
        # Outside the workspace its rust-toolchain.toml no longer applies, so
        # the toolchain is named for the copies.
        toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
        tested=0
        for dir in target/package/*/; do
          name="$(basename "$dir")"
          case "$name" in tmp-crate) continue ;; esac
          [ -f "$dir/Cargo.toml" ] || continue
          rm -rf "$RUNNER_TEMP/$name"
          cp -r "$dir" "$RUNNER_TEMP/$name"
          ( cd "$RUNNER_TEMP/$name" && cargo "+$toolchain" test --all-features )
          tested=$((tested + 1))
        done
        if [ "$tested" -eq 0 ]; then
          echo "No package was produced, so nothing was verified." >&2
          exit 1
        fi
        echo "Verified $tested package(s) outside the source tree."
