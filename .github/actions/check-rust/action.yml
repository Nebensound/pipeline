name: check-rust
description: >-
  The Rust check over one Cargo workspace: formatting, Clippy, tests in every
  feature mode, documentation, a release build, the oldest supported Rust
  version, full coverage, and every published package built and tested from
  its own contents.

# Two inputs, and neither is a setting: where the workspace is, and the plan of
# phase 0 itself, for the versions the package test writes. Both come from
# phase 0, never from the calling repository. The calling job checks the
# repository out and puts the tool on the PATH first (the action `tool`); every
# step runs at the repository root.
#
# The check itself is the tool's: `nebensound-repo run rust` takes the files
# `nebensound-repo files` names for the check and the unit, installs through
# rustup the toolchain the workspace pins in its rust-toolchain.toml, the oldest
# `rust-version` its packages claim and the nightly toolchain the register pins
# for coverage, and runs every step in order, each in a group of the log, up to
# the first that fails. A package `[[exclude]]` takes out as a whole is left out
# of every step. The versions come from the plan handed in, and every manifest
# the package test writes them into is put back as it is committed. It runs the
# same way on a developer's computer, where the versions are resolved from the
# history instead; the reference says what each step runs.

inputs:
  working-directory:
    description: The directory of the Cargo workspace, as the plan names it.
    required: true
  plan:
    description: >-
      The plan of phase 0 (`nebensound-repo plan`), as Declare hands it on: the
      versions the package test writes. A job after Declare checks out the
      commit at hand and nothing before it, so they cannot be resolved here.
    required: true

runs:
  using: composite
  steps:
    # The pinned version of every program the check calls: the register is the
    # only place their versions and digests stand, here as on a developer's
    # computer. They go into the tool's folder in the cache directory, outside
    # the checkout, so that nothing of them ends up in the tree being checked.
    - name: Set up the programs of the Rust check
      shell: bash
      run: nebensound-repo setup --pinned --with-runtimes rust

    # A cache changes how fast the check runs, not what it finds.
    - name: Cache what Cargo builds
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.working-directory }}

    - name: Every Rust file passes the check
      shell: bash
      env:
        UNIT: ${{ inputs.working-directory }}
        PLAN: ${{ inputs.plan }}
      run: nebensound-repo run rust --plan /dev/stdin -- "$UNIT" <<< "$PLAN"
