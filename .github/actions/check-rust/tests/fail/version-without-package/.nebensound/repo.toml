# A workspace that passes every other step, with a unit inside it that selects
# the version writer cargo and whose manifest describes no package. The package
# test writes the versions of the workspace's units first, and the writer
# refuses: there is no package to give the version to. The block fails with the
# writer's sentence, by name.
[repo]
pipeline = "rust-workspace"

[component.loose]
path     = "loose"
pipeline = { version = ["cargo"] }
