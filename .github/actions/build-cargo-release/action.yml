name: build-cargo-release
description: >-
  The build cargo-release for one unit and one target: the one binary of the
  Cargo package whose manifest stands at the unit's path, built in release with
  `cargo build --locked` for the target of the runner, started with
  `--version`, which has to print the version of the run, packed with the
  licence into an archive that the same files make the same bytes, and handed
  on as an artifact of the run.

# Two inputs, and neither is a setting: where the unit is, and the plan of
# phase 0, from which the unit's version of the run is read for the test of
# the binary. No target: Declare gives every target the register lists for
# the build a job of its own on the runner the register names beside it, and
# the tool builds for the one target of the machine it runs on. The calling job
# checks the repository out and puts the tool on the PATH first (the action
# `tool`).
#
# The build itself is the tool's: `nebensound-repo build cargo-release` takes
# the package whose Cargo.toml stands at that path, which has to have exactly
# one binary, installs through rustup the toolchain its workspace pins in its
# rust-toolchain.toml and adds the target to it, builds the binary with
# `cargo build --release --locked --target <target>`, starts it with
# `--version` within a time limit, which has to print the version of the run,
# and packs the binary and the licence of the unit into
# `<binary>-<target>.tar.gz`, each as a group of the log, up to the first that
# fails. The reference of the tool says what each step runs.
#
# The version writer runs before this block in the same job (`version-cargo`),
# so the manifest carries the version of the run: on a pull request the one its
# merge would get, with -pr.<number> behind it.
#
# The artifact is named after the unit's path, its version, the commit it was
# built from and the target: `executable-<path>@<version>@<sha>@<target>`, the
# path percent-encoded as for a crate. It holds exactly one file, the archive.
# The tool names both as outputs of its step.
#
# No cache. What is built here is the artifact a release hands on, and a cache
# that a pull request can write has no business in it.

inputs:
  working-directory:
    description: >-
      The directory of the unit, as the plan names it. A Cargo package with
      exactly one binary must stand there, a member of a workspace or a
      workspace of its own.
    required: true
  plan:
    description: >-
      The plan of phase 0 (`nebensound-repo plan`), as Declare hands it on.
    required: true

runs:
  using: composite
  steps:
    - name: Build the binary
      id: build
      shell: bash
      env:
        UNIT: ${{ inputs.working-directory }}
        PLAN: ${{ inputs.plan }}
      run: nebensound-repo build --plan /dev/stdin cargo-release -- "$UNIT" <<< "$PLAN"

    # Overwrite: a name is unique per unit, version, commit and target, so the
    # only artifact this can replace is the one an earlier attempt of the same
    # job left in this run, and a re-run must not fail on it. The archive is
    # compressed already.
    - name: Hand the archive on
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build.outputs.artifact }}
        path: ${{ steps.build.outputs.archive }}
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
        overwrite: true
