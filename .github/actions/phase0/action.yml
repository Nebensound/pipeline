name: phase0
description: >-
  Reads the declaration of the calling repository, resolves it and checks it
  against what the repository holds: phase 0 of the pipeline.

# No inputs. What a repository is stands in its .nebensound/repo.toml, and this
# action reads it there.
#
# The calling job checks the repository out first: the tool asks Git what the
# repository holds, so there has to be one. It also puts the tool on the PATH
# first, with the action `tool` beside this one, which fills the cache that
# every later job of the run takes the same tool from.

outputs:
  plan:
    description: >-
      Which unit runs which check, as one line of JSON (`nebensound-repo plan`),
      with the versions a pull request's merge would get on a pull request.
      Empty when phase 0 found errors: then nothing is to be started.
    value: ${{ steps.plan.outputs.plan }}

runs:
  using: composite
  steps:
    # Phase 0 holds the declared audience against what the run knows of the
    # repository: how GitHub shows it, `public` exactly when it is public. The
    # event names it; one that does not carry the repository is answered by
    # the API, which the token may always read the repository's metadata
    # from. On a developer's machine nobody passes it, and nothing is
    # compared.
    - name: Run phase 0
      shell: bash
      env:
        VISIBILITY: ${{ github.event.repository.visibility }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [ -z "$VISIBILITY" ]; then
          VISIBILITY="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
        fi
        nebensound-repo -C "$GITHUB_WORKSPACE" check --visibility "$VISIBILITY"

    # Only reached when phase 0 passed. Every Rust package `[[exclude]]` takes
    # out as a whole is named in the summary of the run, with its reason: a
    # notice, not a warning, since the declaration gives the reason.
    # `check-rust` leaves such a package out of every step and compiles it
    # only as a dependency of others.
    - name: Name the excluded packages
      shell: bash
      run: |
        set -euo pipefail
        # The tool writes a refusal where the list would go: into the log
        # with it, or the step fails without saying why.
        if ! list="$(nebensound-repo -C "$GITHUB_WORKSPACE" excluded-packages)"; then
          echo "$list" >&2
          exit 1
        fi
        echo "$list"
        # A workflow command ends at a line break and reads `%` as the start
        # of an escape, so a reason holding either is escaped.
        jq -r '.[]
          | "The Rust package at \(.path) is excluded from every step of check-rust: \(.reason)"
          | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")
          | "::notice title=Excluded package::\(.)"' <<< "$list"

    # Only reached when phase 0 passed: a declaration with errors gets no plan.
    #
    # On a pull request the checkout is the merge commit GitHub builds for it,
    # which touches no unit. The plan is then built for the squash merge, with
    # the title and description as its message, as the job Version reads it:
    # every version in it is the one that merge would get, with -pr.<number>
    # behind it, so that the version writers and the package test of
    # check-rust prove what a merge would publish. The text goes in through
    # the environment, never into the script.
    - name: Hand on the plan
      id: plan
      shell: bash
      env:
        NUMBER: ${{ github.event.pull_request.number }}
        TITLE: ${{ github.event.pull_request.title }}
        BODY: ${{ github.event.pull_request.body }}
      run: |
        set -euo pipefail
        call=(nebensound-repo -C "$GITHUB_WORKSPACE" plan)
        if [ -n "$NUMBER" ]; then
          message="$TITLE"
          if [ -n "$BODY" ]; then
            message="$(printf '%s\n\n%s' "$TITLE" "$BODY")"
          fi
          # One argument with "=", so that a title starting with "-" stays
          # the message and is not read as an option.
          call+=(--pull-request "$NUMBER" "--message=$message")
        fi
        plan="$("${call[@]}")"
        echo "$plan"
        echo "plan=$plan" >> "$GITHUB_OUTPUT"

    # Only reached when phase 0 passed. A pull request that changes for whom
    # the repository is meant names the old and the new value in the summary
    # of the run, as a notice: the value decides which rules hold for the
    # repository, so a reviewer should not have to find it in the diff. The
    # plan carries both, the one before being that of the base branch. Both
    # are one of a few fixed words, so nothing needs escaping.
    - name: Name a change of the audience
      shell: bash
      env:
        NUMBER: ${{ github.event.pull_request.number }}
        PLAN: ${{ steps.plan.outputs.plan }}
      run: |
        set -euo pipefail
        if [ -z "$NUMBER" ]; then
          exit 0
        fi
        jq -r 'select(.audience != .previous_audience)
          | "::notice title=Audience changed::This pull request changes the audience of the repository from \(.previous_audience // "none declared") to \(.audience)."' <<< "$PLAN"
