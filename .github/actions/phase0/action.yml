name: phase0
description: >-
  Reads the declaration of the calling repository, resolves it and checks it
  against what the repository holds: phase 0 of the pipeline. Hands on the
  plan and the matrices of the jobs after it.

# No inputs. What a repository is stands in its .nebensound/repo.toml, and this
# action reads it there.
#
# The calling job checks the repository out first: the tool asks Git what the
# repository holds, so there has to be one. It also puts the tool on the PATH
# first, with the action `tool` beside this one, which fills the cache that
# every later job of the run takes the same tool from.

outputs:
  plan:
    description: >-
      Which unit runs which check, as one line of JSON (`nebensound-repo plan`),
      with the versions a pull request's merge would get on a pull request.
      Empty when phase 0 found errors: then nothing is to be started.
    value: ${{ steps.phase0.outputs.plan }}
  units:
    description: >-
      The units of the plan that run a check, as one line of JSON: the matrix
      of the jobs of the units. Empty when phase 0 found errors.
    value: ${{ steps.phase0.outputs.units }}
  builds:
    description: >-
      The units of the plan that build in this run, each with the version
      writers it selects, as one line of JSON: the matrix of the jobs of the
      builds. Empty when phase 0 found errors.
    value: ${{ steps.phase0.outputs.builds }}

runs:
  using: composite
  steps:
    # One call of the tool: phase 0 with what the event says of the
    # repository, then the plan, a change of the audience on a pull request,
    # the excluded packages and the two matrices, as `nebensound-repo declare`
    # describes them. In a run the tool reports every finding as an
    # annotation.
    #
    # The repository's name, default branch and visibility are not declared:
    # GitHub holds them, and the event of the run names them. The pull
    # request's number, title and description make the message of its squash
    # merge, which the plan is built for. All of it goes in through the
    # environment, never into the script. An event without the name or the
    # branch leaves the tool to read them from Git; one without the
    # visibility is answered by the API, which the token may always read the
    # repository's metadata from.
    - name: Run phase 0
      id: phase0
      shell: bash
      env:
        NEBENSOUND_NAME: ${{ github.event.repository.name }}
        NEBENSOUND_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        NEBENSOUND_VISIBILITY: ${{ github.event.repository.visibility }}
        NEBENSOUND_PULL_REQUEST: ${{ github.event.pull_request.number }}
        NEBENSOUND_TITLE: ${{ github.event.pull_request.title }}
        NEBENSOUND_BODY: ${{ github.event.pull_request.body }}
        GITHUB_TOKEN: ${{ github.token }}
      run: nebensound-repo -C "$GITHUB_WORKSPACE" declare
