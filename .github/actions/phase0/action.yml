name: phase0
description: >-
  Reads the declaration of the calling repository, resolves it and checks it
  against what the repository holds: phase 0 of the pipeline.

# No inputs. What a repository is stands in its .nebensound/repo.toml, and this
# action reads it there.
#
# The calling job checks the repository out first: the tool asks Git what the
# repository holds, so there has to be one. It also puts the tool on the PATH
# first, with the action `tool` beside this one, which fills the cache that
# every later job of the run takes the same tool from.

outputs:
  plan:
    description: >-
      Which unit runs which check, as one line of JSON (`nebensound plan`).
      Empty when phase 0 found errors: then nothing is to be started.
    value: ${{ steps.plan.outputs.plan }}

runs:
  using: composite
  steps:
    - name: Run phase 0
      shell: bash
      run: |
        set -euo pipefail
        nebensound -C "$GITHUB_WORKSPACE" check

    # Only reached when phase 0 passed: a declaration with errors gets no plan.
    - name: Hand on the plan
      id: plan
      shell: bash
      run: |
        set -euo pipefail
        plan="$(nebensound -C "$GITHUB_WORKSPACE" plan)"
        echo "$plan"
        echo "plan=$plan" >> "$GITHUB_OUTPUT"
