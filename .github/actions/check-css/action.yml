name: check-css
description: >-
  The stylesheet check over one unit: every `.css` and `.scss` file the unit
  holds is formatted the way Prettier writes it and passes Stylelint.

# One input, and it is not a setting: where the unit is. It comes from the plan
# of phase 0. The files are the ones `nebensound-repo files` names for the check
# and the unit: what Git tracks below that path with an extension the register
# gives the check, less what an `[[exclude]]` entry of the declaration takes
# out. A file nobody committed is not judged, a committed one is not missed, and
# no ignore mechanism of a tool takes one out. The calling job checks the
# repository out and puts the tool on the PATH first (the action `tool`); every
# step runs at the repository root.

inputs:
  working-directory:
    description: The directory of the unit, as the plan names it.
    required: true

runs:
  using: composite
  steps:
    - name: Find the stylesheets
      id: files
      shell: bash
      env:
        UNIT: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        list="$RUNNER_TEMP/check-css-files"
        # The tool writes a refusal where the list would go: into the log
        # with it, or the step fails without saying why.
        if ! nebensound-repo files -z -- css "$UNIT" > "$list"; then
          cat "$list" >&2
          exit 1
        fi
        count="$(tr -cd '\0' < "$list" | wc -c)"
        echo "count=$count" >> "$GITHUB_OUTPUT"
        echo "list=$list" >> "$GITHUB_OUTPUT"
        if [ "$count" -eq 0 ]; then
          echo "No stylesheet below '$UNIT'; there is nothing to check."
        else
          echo "$count stylesheet(s) to check:"
          tr '\0' '\n' < "$list"
        fi

    # Pinned, installed outside the checkout so that nothing of it ends up in
    # the tree being checked. Stylelint comes with the configurations the
    # pipeline's default extends and with the syntax it reads SCSS with, the
    # versions the register pins beside it; nothing else is installed, so a
    # configuration of the repository that names another package fails.
    - name: Set up Node.js
      if: steps.files.outputs.count != '0'
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install Prettier and Stylelint
      id: tools
      if: steps.files.outputs.count != '0'
      shell: bash
      run: |
        set -euo pipefail
        npm install --prefix "$RUNNER_TEMP/check-css-tools" --no-save --no-package-lock \
          --ignore-scripts --no-fund --no-audit prettier@3.9.6 stylelint@18.0.0 \
          stylelint-config-standard@41.0.0 stylelint-config-standard-scss@18.0.0 \
          postcss-scss@4.0.9

    # The two checks below each run even when the other failed, so a single
    # run reports every finding at once.

    # Prettier as `nebensound-repo run markdown` calls it: the repository's
    # own configuration, no ignore file, and nothing in the configuration that
    # passes a whole file unchecked.
    - name: Every stylesheet is formatted
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      shell: bash
      env:
        LIST: ${{ steps.files.outputs.list }}
      run: |
        set -euo pipefail
        status=0
        # Without colours: on GitHub Actions Prettier colours `warn` and
        # `error`, and the lines below would no longer match.
        : > "$RUNNER_TEMP/check-css-nothing-ignored"
        xargs -0 "$RUNNER_TEMP/check-css-tools/node_modules/.bin/prettier" --check --no-color \
          --with-node-modules --ignore-path "$RUNNER_TEMP/check-css-nothing-ignored" \
          --no-require-pragma --no-check-ignore-pragma \
          --range-start=0 --range-end=Infinity \
          -- < "$LIST" \
          > "$RUNNER_TEMP/check-css-prettier" 2>&1 || status=$?
        # Prettier names an unformatted file as `[warn] <file>` and one it
        # cannot parse as `[error] <file>: <message>`; each becomes an
        # annotation on its file and stays in the log as it is.
        property() {
          local value="$1"
          value="${value//'%'/'%25'}"
          value="${value//':'/'%3A'}"
          value="${value//','/'%2C'}"
          printf '%s' "$value"
        }
        while IFS= read -r line; do
          echo "$line"
          if [[ "$line" =~ ^\[warn\]\ (.+)$ ]] && [ -f "${BASH_REMATCH[1]}" ]; then
            echo "::error file=$(property "${BASH_REMATCH[1]}")::not formatted the way Prettier writes it"
          elif [[ "$line" =~ ^\[error\]\ ([^:]+):\ (.+)$ ]] && [ -f "${BASH_REMATCH[1]}" ]; then
            echo "::error file=$(property "${BASH_REMATCH[1]}")::Prettier cannot read it: ${BASH_REMATCH[2]}"
          fi
        done < "$RUNNER_TEMP/check-css-prettier"
        exit "$status"

    # The pipeline's default (`tools/nebensound-repo/rules/stylelint.yaml`, from
    # the same commit as this file) lies beneath the repository's own
    # configuration, which is laid over it rule by rule: a rule the repository
    # does not name keeps the default's value, so its file names only what
    # differs, and a change of the default reaches it. What its own `extends`
    # names comes along with it, over the default as well.
    #
    # The configuration of a file is the one Stylelint finds for it, the first
    # of its file names (`package.json`, `.stylelintrc`, `.stylelintrc.json`,
    # `.stylelintrc.yaml`, `stylelint.config.mjs`, ...) in the file's folder or
    # the nearest folder above it, up to the repository root. Stylelint gets it
    # as the last of what its configuration extends, with the default first,
    # so Stylelint itself lays the one over the other. An `overrides` entry
    # matches its `files` from the repository root.
    #
    # Its rules hold, but nothing in it takes a file out: `ignoreFiles` is set
    # aside, `.stylelintignore` is not read (an empty ignore file is named
    # instead), and every file is handed over as its content, so no pattern
    # reads its name as a glob. A file that a configuration it extends would
    # still take out fails, since it was not checked. Stylelint resolves a
    # package named in a configuration from the folder of the configuration
    # and then from where the block installed it, so only the pinned packages
    # are found.
    - name: Every stylesheet passes Stylelint
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      shell: bash
      env:
        LIST: ${{ steps.files.outputs.list }}
      run: |
        set -euo pipefail
        : > "$RUNNER_TEMP/check-css-nothing-ignored"
        TOOLS="$RUNNER_TEMP/check-css-tools" NOTHING="$RUNNER_TEMP/check-css-nothing-ignored" \
          DEFAULT="$GITHUB_ACTION_PATH/../../../tools/nebensound-repo/rules/stylelint.yaml" \
          node --input-type=module --eval '
            import fs from "node:fs";
            import { basename, dirname, join, relative, resolve, sep } from "node:path";
            import { pathToFileURL } from "node:url";

            const { TOOLS, LIST, DEFAULT, NOTHING } = process.env;
            const root = process.cwd();
            const load = async (name, ...path) =>
              import(pathToFileURL(join(TOOLS, "node_modules", name, ...path)).href);
            const { default: stylelint } = await load("stylelint", "lib", "index.mjs");
            const { cosmiconfig } = await load("cosmiconfig", "dist", "index.js");

            // The configuration Stylelint finds for a file: the first of its
            // file names in the file folder, else in the folder above, up to
            // the repository root. What lies above the root is no part of the
            // repository, and a configuration in a home folder counts as
            // little.
            const explorer = cosmiconfig("stylelint", { searchStrategy: "none" });
            const found = new Map();
            const own = async (file) => {
              for (let dir = dirname(resolve(file)); ; dir = dirname(dir)) {
                if (!found.has(dir)) {
                  found.set(dir, await explorer.search(dir));
                }
                const result = found.get(dir);
                if (result && !result.isEmpty) {
                  return result;
                }
                if (dir === root || !dir.startsWith(root + sep)) {
                  return null;
                }
              }
            };

            const { config: defaults } = await explorer.load(DEFAULT);
            const escape = (value) =>
              value.replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A");
            const property = (value) => escape(value).replaceAll(":", "%3A").replaceAll(",", "%2C");
            // A plain log line carries text from the checked file too; a line
            // break in it would start a workflow command of its own.
            const flat = (value) => value.replace(/[\r\n]+/g, " ");
            const message = (error) => (error instanceof Error ? error.message : String(error));

            const list = fs.readFileSync(LIST, "utf8").split("\0").filter((file) => file !== "");
            const shown = new Set();
            let laid = false;
            for (const file of list) {
              const absolute = resolve(file);
              let result;
              try {
                const config = await own(file);
                if (config && !shown.has(config.filepath)) {
                  shown.add(config.filepath);
                  laid = true;
                  console.log(`Rules: the pipeline default, and laid over it ${flat(relative(root, config.filepath))}`);
                }
                // The configuration is named by its file, so that the paths
                // in it stay relative to it, except where it stands in
                // package.json, which Stylelint would read whole.
                const layer = config
                  ? basename(config.filepath) === "package.json" ? config.config : config.filepath
                  : [];
                ({ results: [result] } = await stylelint.lint({
                  code: fs.readFileSync(absolute, "utf8"),
                  codeFilename: absolute,
                  config: { extends: [defaults, layer].flat(), ignoreFiles: [] },
                  configBasedir: root,
                  cwd: TOOLS,
                  ignorePath: NOTHING,
                  allowEmptyInput: true,
                }));
              } catch (error) {
                console.log(`::error file=${property(file)}::Stylelint cannot check it: ${escape(message(error))}`);
                process.exitCode = 1;
                continue;
              }
              if (result.ignored) {
                console.log(`::error file=${property(file)}::what the Stylelint configuration extends takes it out, and only an [[exclude]] entry may; it was not checked`);
                process.exitCode = 1;
                continue;
              }
              for (const warning of result.invalidOptionWarnings ?? []) {
                console.log(`::error file=${property(file)}::Stylelint: ${escape(warning.text)}`);
                process.exitCode = 1;
              }
              // Every finding is an annotation on its line. A warning fails
              // nothing, an error fails the step, as on the command line.
              for (const warning of result.warnings) {
                const kind = warning.severity === "error" ? "error" : "warning";
                console.log(`${flat(file)}:${warning.line}:${warning.column} ${kind} ${flat(warning.text)}`);
                console.log(`::${kind} file=${property(file)},line=${warning.line},col=${warning.column}::${escape(warning.text)}`);
                if (kind === "error") {
                  process.exitCode = 1;
                }
              }
            }
            if (!laid) {
              console.log("Rules: the pipeline default");
            }
          '
