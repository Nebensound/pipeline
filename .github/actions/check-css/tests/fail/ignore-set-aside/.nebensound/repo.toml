# A configuration whose ignoreFiles would take every stylesheet out. It is
# JavaScript, which the tool never reads and Stylelint never loads, so the
# stylesheet is checked and fails.
[repo]
audience = "public"
pipeline = { check = ["css"] }

[[exclude]]
path   = "stylelint.config.mjs"
reason = "the configuration under test; JavaScript, which no check of the case covers"
