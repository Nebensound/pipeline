name: check-markdown
description: >-
  The Markdown check over one unit: every `.md` and `.markdown` file the unit
  holds is formatted the way Prettier writes it, passes Markdownlint, and its
  links into the repository lead somewhere.

# One input, and it is not a setting: where the unit is. It comes from the plan
# of phase 0. The files are the ones `nebensound files` names for the check and
# the unit: what Git tracks below that path with an extension the register
# gives the check, less what an `[[exclude]]` entry of the declaration takes
# out. A file nobody committed is not judged, a committed one is not missed,
# and no ignore mechanism of a tool takes one out. The calling job checks the
# repository out and puts the tool on the PATH first (the action `tool`); every
# step runs at the repository root.

inputs:
  working-directory:
    description: The directory of the unit, as the plan names it.
    required: true

runs:
  using: composite
  steps:
    # Paths stay relative to the repository root, and every step runs there:
    # that is where the repository keeps its configuration, and where an
    # annotation has to point.
    - name: Find the Markdown files
      id: files
      shell: bash
      env:
        UNIT: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        list="$RUNNER_TEMP/check-markdown-files"
        # The tool writes a refusal where the list would go: into the log
        # with it, or the step fails without saying why.
        if ! nebensound files -z -- markdown "$UNIT" > "$list"; then
          cat "$list" >&2
          exit 1
        fi
        count="$(tr -cd '\0' < "$list" | wc -c)"
        # One path per line for the link check, which reads no other form. A
        # file name holding a line break is not something it could be given.
        # It reads every line as a glob, so the characters of one are put in
        # brackets: `[docs]/a.md` would otherwise match nothing and pass. It
        # runs in a folder of its own (see there), so every path is absolute,
        # which also keeps a line from beginning with `#`, a comment to it.
        mkdir -p "$RUNNER_TEMP/check-markdown-links"
        # The repository root, as a glob and then as replacement text for sed.
        root="$(printf '%s' "$PWD" | sed -e 's/[][*?{}]/[&]/g' -e 's/[|&\]/\\&/g')"
        tr '\0' '\n' < "$list" | sed -e 's/[][*?{}]/[&]/g' -e "s|^|$root/|" > "$list-lines"
        {
          echo "count=$count"
          echo "list=$list"
          echo "lines=$list-lines"
        } >> "$GITHUB_OUTPUT"
        if [ "$count" -eq 0 ]; then
          echo "No Markdown file below '$UNIT'; there is nothing to check."
        else
          echo "$count Markdown file(s) to check:"
          tr '\0' '\n' < "$list"
        fi

    # Pinned, installed outside the checkout so that nothing of it ends up in
    # the tree being checked.
    - name: Set up Node.js
      if: steps.files.outputs.count != '0'
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install Prettier and Markdownlint
      id: tools
      if: steps.files.outputs.count != '0'
      shell: bash
      run: |
        set -euo pipefail
        npm install --prefix "$RUNNER_TEMP/check-markdown-tools" --no-save --no-package-lock \
          --ignore-scripts --no-fund --no-audit prettier@3.9.6 markdownlint-cli2@0.23.2

    # The three checks below each run even when one before them failed, so a
    # single run reports every finding at once.

    # Prettier reads the repository's own configuration, so a repository
    # decides how it formats. It reads no ignore file: by default it would
    # read `.prettierignore` and `.gitignore` and silently pass what they
    # name, so it is handed an empty one instead, and it leaves out no
    # node_modules either. What is not to be checked is not in the list.
    - name: Every Markdown file is formatted
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      shell: bash
      env:
        LIST: ${{ steps.files.outputs.list }}
      run: |
        set -euo pipefail
        status=0
        : > "$RUNNER_TEMP/check-markdown-nothing-ignored"
        xargs -0 "$RUNNER_TEMP/check-markdown-tools/node_modules/.bin/prettier" --check \
          --with-node-modules --ignore-path "$RUNNER_TEMP/check-markdown-nothing-ignored" \
          -- < "$LIST" \
          > "$RUNNER_TEMP/check-markdown-prettier" 2>&1 || status=$?
        # Prettier names an unformatted file as `[warn] <file>` and one it
        # cannot parse as `[error] <file>: <message>`; each becomes an
        # annotation on its file and stays in the log as it is.
        property() {
          local value="$1"
          value="${value//'%'/'%25'}"
          value="${value//':'/'%3A'}"
          value="${value//','/'%2C'}"
          printf '%s' "$value"
        }
        while IFS= read -r line; do
          echo "$line"
          if [[ "$line" =~ ^\[warn\]\ (.+)$ ]] && [ -f "${BASH_REMATCH[1]}" ]; then
            echo "::error file=$(property "${BASH_REMATCH[1]}")::not formatted the way Prettier writes it"
          elif [[ "$line" =~ ^\[error\]\ ([^:]+):\ (.+)$ ]] && [ -f "${BASH_REMATCH[1]}" ]; then
            echo "::error file=$(property "${BASH_REMATCH[1]}")::Prettier cannot read it: ${BASH_REMATCH[2]}"
          fi
        done < "$RUNNER_TEMP/check-markdown-prettier"
        exit "$status"

    # A repository's own Markdownlint configuration at its root wins; without
    # one, the configuration beside this file holds. Its rules hold as written,
    # but nothing in it takes a file out. markdownlint-cli2 would skip a named
    # file in three ways: through `ignores` in any options file, and through a
    # negated entry of `globs` or through `gitignore` in the options file of
    # the folder it starts from. So it is called through its own `main`: every
    # file is handed over literally (`:` in front), which `gitignore` does not
    # reach; it starts from an empty folder, so the repository's options file
    # counts as that of the repository's folder, whose `globs` play no part;
    # and `ignores` is overridden with an empty list for every folder. What
    # remains is the repository's rules, read as markdownlint-cli2 reads them.
    - name: Every Markdown file passes Markdownlint
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      shell: bash
      env:
        LIST: ${{ steps.files.outputs.list }}
      run: |
        set -euo pipefail
        config="$GITHUB_ACTION_PATH/default.markdownlint-cli2.jsonc"
        for own in \
          .markdownlint-cli2.jsonc .markdownlint-cli2.yaml .markdownlint-cli2.cjs \
          .markdownlint-cli2.mjs .markdownlint.jsonc .markdownlint.json \
          .markdownlint.yaml .markdownlint.yml .markdownlint.cjs .markdownlint.mjs; do
          if [ -f "$own" ]; then
            config="$own"
            break
          fi
        done
        echo "Configuration: $config"
        # The folder it starts from. It names every file relative to that
        # folder, so that prefix is taken off again where a finding is printed.
        base="$(mktemp -d "$RUNNER_TEMP/check-markdown-base.XXXXXX")"
        prefix="$(realpath --relative-to="$base" "$PWD")/"
        fallback=""
        if [ "$config" = "$GITHUB_ACTION_PATH/default.markdownlint-cli2.jsonc" ]; then
          fallback="$config"
        fi
        status=0
        TOOLS="$RUNNER_TEMP/check-markdown-tools" BASE="$base" FALLBACK="$fallback" \
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            import { join, resolve } from "node:path";
            import { pathToFileURL } from "node:url";

            const { TOOLS, BASE, LIST, FALLBACK } = process.env;
            const cli = join(TOOLS, "node_modules", "markdownlint-cli2", "markdownlint-cli2.mjs");
            const { main } = await import(pathToFileURL(cli).href);
            const argv = readFileSync(LIST, "utf8")
              .split("\0")
              .filter((file) => file !== "")
              .map((file) => `:${resolve(file)}`);
            if (FALLBACK) {
              argv.push("--config", FALLBACK);
            }
            process.exitCode = await main({
              directory: BASE,
              argv,
              logMessage: (message) => console.log(message),
              logError: (message) => console.error(message),
              optionsOverride: { ignores: [] },
            });
          ' > "$RUNNER_TEMP/check-markdown-lint" 2>&1 || status=$?
        # A finding reads `<file>:<line>[:<column>] error <rule> <message>`;
        # each becomes an annotation on its line and stays in the log as it is.
        while IFS= read -r line; do
          line="${line#"$prefix"}"
          echo "$line"
          if [[ "$line" =~ ^(.+):([0-9]+)(:([0-9]+))?\ error\ (.+)$ ]]; then
            position="file=${BASH_REMATCH[1]},line=${BASH_REMATCH[2]}"
            if [ -n "${BASH_REMATCH[4]}" ]; then position="$position,col=${BASH_REMATCH[4]}"; fi
            echo "::error $position::${BASH_REMATCH[5]}"
          fi
        done < "$RUNNER_TEMP/check-markdown-lint"
        exit "$status"

    # Links into the repository only: a file that is not there, a heading that
    # is not in it. `--offline` sends no request, so a pull request does not
    # turn red because someone else's server is down; links to the outside are
    # not checked in a pull request at all. A file without a link is not a
    # finding. lychee is pinned here and not left to the default of the action.
    # It runs in a folder of its own, so that it reads neither a `lychee.toml`
    # nor a `.lycheeignore` of the repository: an `exclude_path` there would
    # take files out. `--hidden` and `--no-ignore` keep it from skipping a file
    # in a hidden folder or one a `.gitignore` names. The report goes outside
    # the checkout.
    - name: Every link into the repository leads somewhere
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      uses: lycheeverse/lychee-action@v2
      with:
        lycheeVersion: v0.24.2
        workingDirectory: ${{ runner.temp }}/check-markdown-links
        args: >-
          --offline --include-fragments --no-progress --hidden --no-ignore
          --root-dir ${{ github.workspace }}
          --files-from ${{ steps.files.outputs.lines }}
        output: ${{ runner.temp }}/check-markdown-links.md
        # The action hands lychee the token of the job by default. Offline it
        # has nothing to ask GitHub, so it gets none.
        token: ""
        fail: true
        failIfEmpty: false
