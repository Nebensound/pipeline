name: build-cargo-package
description: >-
  The build cargo-package for one unit: the one Cargo package whose manifest
  stands at the unit's path, packaged once with `cargo package --locked`, the
  packaged file tested from its own contents outside the source tree, and
  handed on as an artifact of the run.

# One input, and it is not a setting: where the unit is, as the plan of phase 0
# names it, never the calling repository. The calling job checks the
# repository out and puts the tool on the PATH first (the action `tool`).
#
# The build itself is the tool's: `nebensound-repo build cargo-package` takes
# the package whose Cargo.toml stands at that path, installs through rustup the
# toolchain its workspace pins in its rust-toolchain.toml, read there rather
# than handed in, patches in the local packages it depends on, packages it with
# `cargo package --locked`, tests the packaged file from its own contents
# outside the source tree, and runs each of these as a group of the log, up to
# the first that fails. The reference of the tool says what each step runs.
#
# The version writer runs before this block in the same job (`version-cargo`),
# so the manifest carries the version of the run: on a pull request the one its
# merge would get, with -pr.<number> behind it. Git does not have that change,
# which is why `cargo package` runs with `--allow-dirty`; nothing else in the
# checkout is changed.
#
# The artifact is named after the unit's path, its version and the commit it was
# built from: `crate-<path>@<version>@<sha>`, the path percent-encoded (`.` for
# the repository itself, `tools%2Ffoo` for tools/foo). The encoding is
# reversible and never writes an `@`, so two units cannot share a name, whoever
# takes the crate on finds a unit's artifact from the same plan with the
# pattern `crate-<path>@*`, and every character an artifact name forbids stays
# out. It holds exactly one file, `<package>-<version>.crate`. The tool names
# both as outputs of its step.
#
# No cache. What is built here is the artifact a release hands on, and a cache
# that a pull request can write has no business in it.

inputs:
  working-directory:
    description: >-
      The directory of the unit, as the plan names it. A Cargo package must
      stand there, a member of a workspace or a workspace of its own.
    required: true

runs:
  using: composite
  steps:
    - name: Build the crate
      id: build
      shell: bash
      env:
        UNIT: ${{ inputs.working-directory }}
      run: nebensound-repo build cargo-package -- "$UNIT"

    # Overwrite: a name is unique per unit, version and commit, so the only
    # artifact this can replace is the one an earlier attempt of the same job
    # left in this run, and a re-run must not fail on it.
    - name: Hand the crate on
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build.outputs.artifact }}
        path: ${{ steps.build.outputs.crate }}
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
        overwrite: true
