name: check-dockerfile
description: >-
  The Dockerfile check over one unit: every `Dockerfile`, `Containerfile` and
  `.dockerfile` file the unit holds is formatted the way dockerfmt writes it
  and passes Hadolint.

# One input, and it is not a setting: where the unit is. It comes from the plan
# of phase 0. The calling job checks the repository out and puts the tool on the
# PATH first (the action `tool`); every step runs at the repository root.
# Building the image and running it belong to the build, not here.
#
# The check itself is the tool's: `nebensound-repo run dockerfile` takes the
# files `nebensound-repo files` names for the check and the unit (what Git
# tracks below that path with a file name or an extension the register gives
# the check, less what an `[[exclude]]` entry of the declaration takes out),
# starts dockerfmt and Hadolint as the register pins them, hands Hadolint the
# repository's configuration with what would pass every finding set aside, and
# reports every finding with its file, and its line and column where the
# program gives them, as an annotation of the run: an error, or a warning for
# what fails nothing. A file nobody committed is not judged, a committed one is
# not missed, and no ignore mechanism of a program takes one out. It runs the
# same way on a developer's computer; the reference says what each program is
# handed.

inputs:
  working-directory:
    description: The directory of the unit, as the plan names it.
    required: true

runs:
  using: composite
  steps:
    # The pinned version of every program the check calls: the register is the
    # only place their versions and digests stand, here as on a developer's
    # computer. They go into the tool's folder in the cache directory, outside
    # the checkout, so that nothing of them ends up in the tree being checked.
    - name: Set up the programs of the Dockerfile check
      shell: bash
      run: nebensound-repo setup --pinned --with-runtimes dockerfile

    - name: Every Dockerfile passes the check
      shell: bash
      env:
        UNIT: ${{ inputs.working-directory }}
      run: nebensound-repo run dockerfile -- "$UNIT"
