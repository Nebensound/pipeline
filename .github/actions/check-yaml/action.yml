name: check-yaml
description: >-
  The YAML check over one unit: every `.yml` and `.yaml` file the unit holds
  parses and is formatted the way Prettier writes it, every GitHub Actions
  workflow among them passes actionlint, and the Dependabot configuration
  among them matches the Dependabot schema. Whether a file parses and whether
  the Dependabot configuration matches its schema the tool judges itself;
  Prettier and actionlint are the programs it starts.

# One input, and it is not a setting: where the unit is. It comes from the plan
# of phase 0. The calling job checks the repository out and puts the tool on the
# PATH first (the action `tool`); every step runs at the repository root.
#
# The check itself is the tool's: `nebensound-repo run yaml` takes the files
# `nebensound-repo files` names for the check and the unit (what Git tracks
# below that path with an extension or a file name the register gives the
# check, less what an `[[exclude]]` entry of the declaration takes out), starts
# the programs the register pins for the check with the flags that set their
# own ignore mechanisms aside, and reports every finding with its file, and its
# line and column where the program gives them, as an annotation of the run. A
# file nobody committed is not judged, a committed one is not missed, and no
# ignore mechanism of a program takes one out. It runs the same way on a
# developer's computer; the reference says what each program is handed.

inputs:
  working-directory:
    description: The directory of the unit, as the plan names it.
    required: true

runs:
  using: composite
  steps:
    # The pinned version of every program the check calls, and a runtime one
    # of them needs where the runner has none that is new enough: the register
    # is the only place their versions stand, here as on a developer's
    # computer. They go into the tool's folder in the cache directory, outside
    # the checkout, so that nothing of them ends up in the tree being checked.
    - name: Set up the programs of the YAML check
      shell: bash
      run: nebensound-repo setup --pinned --with-runtimes yaml

    - name: Every YAML file passes the check
      shell: bash
      env:
        UNIT: ${{ inputs.working-directory }}
      run: nebensound-repo run yaml -- "$UNIT"
