name: check-html
description: >-
  The HTML check over one unit: every `.html` and `.htm` file the unit holds is
  formatted the way Prettier writes it, passes html-validate, carries what a
  page must carry if it is a page, and its links into the repository lead
  somewhere.

# One input, and it is not a setting: where the unit is. It comes from the plan
# of phase 0. The files are the ones `nebensound-repo files` names for the check
# and the unit: what Git tracks below that path with an extension the register
# gives the check, less what an `[[exclude]]` entry of the declaration takes
# out. A file nobody committed is not judged, a committed one is not missed, and
# no ignore mechanism of a tool takes one out. HTML that a build generates is
# checked like written HTML once it is committed. The calling job checks the
# repository out and puts the tool on the PATH first (the action `tool`); every
# step runs at the repository root.

inputs:
  working-directory:
    description: The directory of the unit, as the plan names it.
    required: true

runs:
  using: composite
  steps:
    # Paths stay relative to the repository root, and every step runs there:
    # that is where the repository keeps its configuration, and where an
    # annotation has to point.
    - name: Find the HTML files
      id: files
      shell: bash
      env:
        UNIT: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        list="$RUNNER_TEMP/check-html-files"
        # The tool writes a refusal where the list would go: into the log
        # with it, or the step fails without saying why.
        if ! nebensound-repo files -z -- html "$UNIT" > "$list"; then
          cat "$list" >&2
          exit 1
        fi
        count="$(tr -cd '\0' < "$list" | wc -c)"
        # One path per line for the link check, written as check-markdown
        # writes it: the path from the repository root, with one character
        # put in brackets where lychee would misread the line.
        tr '\0' '\n' < "$list" | sed \
          -e 's/[][*?{}]/[&]/g' \
          -e 's/^[#[:space:]]/[&]/' \
          -e 's/[[:space:]]$/[&]/' \
          -e 's|^\([A-Za-z]\)\([^/]*:\)|[\1]\2|' \
          > "$list-lines"
        # The configuration of the link check is named, never looked for, as
        # in check-markdown: a copy of `lychee.toml`, or an empty file where
        # there is none.
        config="$RUNNER_TEMP/check-html-lychee.toml"
        if [ -f lychee.toml ] && [ ! -L lychee.toml ]; then
          cp lychee.toml "$config"
        else
          : > "$config"
        fi
        # A link from the root of a site, such as `/style.css` or `/login`, is
        # not checked: where the site is served, and which routes its server
        # answers, the declaration does not say. lychee resolves such a link
        # below the folder it is given as the root and leaves out every
        # address below it, through a second configuration whose pattern
        # names that folder, every character of it taken literally.
        rooted="$RUNNER_TEMP/check-html-root-relative"
        mkdir -p "$rooted"
        pattern="$(printf '%s' "$rooted" | sed 's/[][\\.*^$+?(){}|]/\\&/g')"
        printf "exclude = ['^file://%s/']\n" "$pattern" > "$RUNNER_TEMP/check-html-lychee-rooted.toml"
        {
          echo "count=$count"
          echo "list=$list"
          echo "lines=$list-lines"
          echo "lychee-config=$config"
          echo "lychee-rooted=$RUNNER_TEMP/check-html-lychee-rooted.toml"
          echo "root=$rooted"
        } >> "$GITHUB_OUTPUT"
        if [ "$count" -eq 0 ]; then
          echo "No HTML file below '$UNIT'; there is nothing to check."
        else
          echo "$count HTML file(s) to check:"
          tr '\0' '\n' < "$list"
        fi

    # Pinned, installed outside the checkout so that nothing of it ends up in
    # the tree being checked. Nothing else is installed, so a configuration of
    # the repository that names another package, such as a plugin, fails.
    - name: Set up Node.js
      if: steps.files.outputs.count != '0'
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install Prettier and html-validate
      id: tools
      if: steps.files.outputs.count != '0'
      shell: bash
      run: |
        set -euo pipefail
        npm install --prefix "$RUNNER_TEMP/check-html-tools" --no-save --no-package-lock \
          --ignore-scripts --no-fund --no-audit prettier@3.9.6 html-validate@11.21.1

    # The three checks below each run even when one before them failed, so a
    # single run reports every finding at once.

    # Prettier as in check-markdown: the repository's own configuration, no
    # ignore file, and nothing in the configuration that passes a whole file
    # unchecked.
    - name: Every HTML file is formatted
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      shell: bash
      env:
        LIST: ${{ steps.files.outputs.list }}
      run: |
        set -euo pipefail
        status=0
        # Without colours: on GitHub Actions Prettier colours `warn` and
        # `error`, and the lines below would no longer match.
        : > "$RUNNER_TEMP/check-html-nothing-ignored"
        xargs -0 "$RUNNER_TEMP/check-html-tools/node_modules/.bin/prettier" --check --no-color \
          --with-node-modules --ignore-path "$RUNNER_TEMP/check-html-nothing-ignored" \
          --no-require-pragma --no-check-ignore-pragma \
          --range-start=0 --range-end=Infinity \
          -- < "$LIST" \
          > "$RUNNER_TEMP/check-html-prettier" 2>&1 || status=$?
        # Prettier names an unformatted file as `[warn] <file>` and one it
        # cannot parse as `[error] <file>: <message>`; each becomes an
        # annotation on its file and stays in the log as it is.
        property() {
          local value="$1"
          value="${value//'%'/'%25'}"
          value="${value//':'/'%3A'}"
          value="${value//','/'%2C'}"
          printf '%s' "$value"
        }
        while IFS= read -r line; do
          echo "$line"
          if [[ "$line" =~ ^\[warn\]\ (.+)$ ]] && [ -f "${BASH_REMATCH[1]}" ]; then
            echo "::error file=$(property "${BASH_REMATCH[1]}")::not formatted the way Prettier writes it"
          elif [[ "$line" =~ ^\[error\]\ ([^:]+):\ (.+)$ ]] && [ -f "${BASH_REMATCH[1]}" ]; then
            echo "::error file=$(property "${BASH_REMATCH[1]}")::Prettier cannot read it: ${BASH_REMATCH[2]}"
          fi
        done < "$RUNNER_TEMP/check-html-prettier"
        exit "$status"

    # The pipeline's default (`tools/nebensound-repo/rules/html-validate.json`,
    # from the same commit as this file: the presets `recommended`, `a11y` and
    # `prettier`, the last switching off what contradicts Prettier) lies
    # beneath the repository's own configuration, which is laid over it rule by
    # rule: a rule the repository does not name keeps the default's value, so
    # its file names only what differs, and a change of the default reaches it.
    #
    # The repository's configuration is what html-validate reads for a file:
    # the `.htmlvalidate.json` (or `.mjs`, `.cjs`, `.js`) of its folder and of
    # every folder above it, the nearer one over the farther, up to one that
    # says `root: true` and no farther than the repository root. A flat
    # configuration (`html-validate.config.*`), which is JavaScript in a form
    # of its own, is not read and fails. Its `.htmlvalidateignore` files are
    # not read either: every file of the list is checked.
    #
    # Over both lie the page rules beside this file (`page-rules.mjs`): every
    # page has a title, a description, exactly one `h1`, and alternative text
    # on every image. A page is a file whose document begins with
    # `<!doctype html>` or has an `<html>` root; any other file, such as a
    # fragment a generator includes, gets the rules above without them. They
    # are switched on last, so the repository's configuration cannot switch
    # them off, and an inline `html-validate-disable` comment does not reach
    # them: only an `[[exclude]]` entry takes a page out. A package named in a
    # configuration is resolved from where the block installed html-validate,
    # so only the pinned ones are found.
    - name: Every HTML file passes html-validate and the page rules
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      shell: bash
      env:
        LIST: ${{ steps.files.outputs.list }}
      run: |
        set -euo pipefail
        echo "Rules: the pipeline default, with the repository's configuration and the page rules laid over it"
        TOOLS="$RUNNER_TEMP/check-html-tools" RULES="$GITHUB_ACTION_PATH/page-rules.mjs" \
          DEFAULT="$GITHUB_ACTION_PATH/../../../tools/nebensound-repo/rules/html-validate.json" \
          node --input-type=module --eval '
            import fs from "node:fs";
            import { join, relative, resolve, sep } from "node:path";
            import { pathToFileURL } from "node:url";

            const { TOOLS, LIST, DEFAULT, RULES } = process.env;
            const root = process.cwd();
            const message = (error) => (error instanceof Error ? error.message : String(error));
            // html-validate leaves a rejection unhandled beside the error it
            // throws when a configuration names a module that is not there.
            // The error is reported with the file; anything left unhandled
            // fails the step as well.
            process.on("unhandledRejection", (error) => {
              console.error(`html-validate: ${message(error)}`);
              process.exitCode = 1;
            });
            const { ConfigLoader, FileSystemConfigLoader, HtmlValidate, Rule, esmResolver } =
              await import(pathToFileURL(
                join(TOOLS, "node_modules", "html-validate", "dist", "esm", "index.js"),
              ).href);
            const { default: pageRules, RULES: PAGE_RULES } = await import(pathToFileURL(RULES).href);

            // The configuration files html-validate reads for a file. Only
            // those inside the repository count: what lies above its root is
            // no part of it.
            const inside = (file) => {
              const path = relative(root, resolve(file));
              return path !== ".." && !path.startsWith(`..${sep}`);
            };
            const view = { ...fs, existsSync: (file) => inside(file) && fs.existsSync(file) };
            const resolvers = [esmResolver()];
            const files = new FileSystemConfigLoader(resolvers, {}, { fs: view });
            const base = await files.loadFromObject(JSON.parse(fs.readFileSync(DEFAULT, "utf8")));
            const forced = await files.loadFromObject({ plugins: [pageRules(Rule)], rules: PAGE_RULES });

            // Hands html-validate the configuration of one file, resolved.
            class Resolved extends ConfigLoader {
              constructor(config) {
                super(resolvers);
                this.resolved = config;
              }
              getConfigFor() {
                return this.resolved;
              }
              flushCache() {}
              defaultConfig() {
                return this.resolved;
              }
            }

            const escape = (value) =>
              value.replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A");
            const property = (value) => escape(value).replaceAll(":", "%3A").replaceAll(",", "%2C");

            for (const name of [
              "html-validate.config.mjs", "html-validate.config.cjs", "html-validate.config.js",
              "html-validate.config.mts", "html-validate.config.cts", "html-validate.config.ts",
            ]) {
              if (fs.existsSync(name)) {
                console.log(`::error file=${property(name)}::html-validate would read this flat configuration in place of every .htmlvalidate file, and check-html does not read it; write its rules into .htmlvalidate.json instead`);
                process.exitCode = 1;
              }
            }
            const list = fs.readFileSync(LIST, "utf8").split("\0").filter((file) => file !== "");
            for (const file of list) {
              let report;
              try {
                const own = await files.fromFilenameAsync(resolve(file));
                const layered = own ? await base.merge(resolvers, own) : base;
                const config = await layered.merge(resolvers, forced);
                report = await new HtmlValidate(new Resolved(config.resolve())).validateFile(file);
              } catch (error) {
                console.log(`::error file=${property(file)}::html-validate cannot check it: ${escape(message(error))}`);
                process.exitCode = 1;
                continue;
              }
              // Every finding is an annotation on its line, named by its
              // rule. A warning fails nothing, an error fails the step.
              for (const result of report.results) {
                for (const found of result.messages) {
                  const kind = found.severity >= 2 ? "error" : "warning";
                  const text = `${found.ruleId}: ${found.message}`;
                  console.log(`${file}:${found.line}:${found.column} ${kind} ${text}`);
                  console.log(`::${kind} file=${property(file)},line=${found.line},col=${found.column}::${escape(text)}`);
                  if (kind === "error") {
                    process.exitCode = 1;
                  }
                }
              }
            }
          '

    # Links into the repository only, run as in check-markdown: a file that is
    # not there, an `id` that is not in it. `--offline` sends no request, so
    # links to the outside are not checked. lychee reads the repository's
    # `lychee.toml` (named with `--config`) and `.lycheeignore`; phase 0 holds
    # an `exclude_path` there against the declaration. Every link lychee finds
    # in a page counts, a stylesheet or an image as much as an anchor. A link
    # from the root of a site is not checked (see the first step).
    - name: Every link into the repository leads somewhere
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      uses: lycheeverse/lychee-action@v2
      with:
        lycheeVersion: v0.24.2
        args: >-
          --offline --include-fragments --no-progress --hidden --no-ignore
          --config ${{ steps.files.outputs.lychee-config }}
          --config ${{ steps.files.outputs.lychee-rooted }}
          --root-dir ${{ steps.files.outputs.root }}
          --files-from ${{ steps.files.outputs.lines }}
        output: ${{ runner.temp }}/check-html-links.md
        # The action hands lychee the token of the job by default. Offline it
        # has nothing to ask GitHub, so it gets none.
        token: ""
        fail: true
        failIfEmpty: false
