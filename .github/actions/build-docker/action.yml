name: build-docker
description: >-
  The build docker for one unit: the image of the unit's deploy/Dockerfile,
  built once for linux/amd64 into an OCI layout and labelled with the unit's
  version, identified by its manifest digest, started from exactly that layout
  as the image configures it until Docker reports it healthy, held to a user
  other than root, scanned for vulnerabilities, and handed on as an artifact of
  the run.

# Two inputs, and neither is a setting: where the unit is, and the plan of
# phase 0, from which the unit's version of the run is read for the image's
# label. The calling job checks the repository out and puts the tool on the
# PATH first (the action `tool`); the version writers have run before this
# block in the same job, so a Rust service already carries its version in the
# build context.
#
# The build itself is the tool's: `nebensound-repo build docker` finds the
# image of the unit (deploy/Dockerfile below its path, and nothing else), builds
# it once for linux/amd64 by a BuildKit of its own without a cache into an OCI
# layout labelled with the unit's version, the commit, the repository's address
# and the unit's name, reads its manifest digest into the log and the summary
# of the run, requires a HEALTHCHECK, loads and starts exactly that layout as
# the image configures it until Docker reports it healthy, requires a user
# other than root, scans it with Trivy for vulnerabilities of severity HIGH or
# CRITICAL that have a fixed version, and removes what it started, each step as
# a group of the log, up to the first that fails. The reference of the tool
# says what each step runs. BuildKit and Trivy are the ones the register pins;
# the first step puts the pinned Trivy into the tool's folder.
#
# The artifact is named after the unit's path, its version and the commit:
# `container-<path>@<version>@<sha>`, the path percent-encoded as for a crate.
# It holds exactly one file, `image.tar`, the OCI layout. The tool names both
# as outputs of its step. Nothing is pushed.

inputs:
  working-directory:
    description: >-
      The directory of the unit, as the plan names it. Its image is built from
      deploy/Dockerfile there.
    required: true
  plan:
    description: >-
      The plan of phase 0 (`nebensound-repo plan`), as Declare hands it on.
    required: true

runs:
  using: composite
  steps:
    # The pinned version of every program the build calls: the register is the
    # only place their versions and digests stand.
    - name: Set up the programs of the image build
      shell: bash
      run: nebensound-repo setup --pinned docker

    - name: Build the image
      id: build
      shell: bash
      env:
        UNIT: ${{ inputs.working-directory }}
        PLAN: ${{ inputs.plan }}
      run: nebensound-repo build --plan /dev/stdin docker -- "$UNIT" <<< "$PLAN"

    # Overwrite: a name is unique per unit, version and commit, so the only
    # artifact this can replace is the one an earlier attempt of the same job
    # left in this run, and a re-run must not fail on it.
    - name: Hand the image on
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build.outputs.artifact }}
        path: ${{ steps.build.outputs.image }}
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
        overwrite: true
