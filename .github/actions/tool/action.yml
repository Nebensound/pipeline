name: tool
description: >-
  Puts the tool `nebensound-repo` on the PATH of the calling job: restored from
  the cache when this exact tool was built before, built from source otherwise.
  Also writes the shell functions that put text from the repository into a
  step's log, and names them in NEBENSOUND_SHOWN.

# No inputs. The tool comes from the same commit as this file. GitHub fetches
# the whole repository when it resolves an action, so the source lies three
# levels up and needs no credentials.
#
# Phase 0 fills the cache, so a later job of the same run finds it there and
# builds nothing: `Declare` runs phase 0 with it, and every unit job asks it
# which files a check covers. A job builds the tool itself only when the cache
# misses.

outputs:
  path:
    description: The tool, as an absolute path.
    value: ${{ steps.tool.outputs.home }}/nebensound-repo

runs:
  using: composite
  steps:
    # The key is the content of the tool, not a version: the tool carries none,
    # and two commits that leave it untouched share one build.
    - name: Identify the tool
      id: tool
      shell: bash
      run: |
        set -euo pipefail
        source_dir="$(cd "$GITHUB_ACTION_PATH/../../../tools/nebensound-repo" && pwd)"
        fingerprint="$(
          cd "$source_dir"
          find . -type f -not -path './target/*' -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            | sha256sum \
            | cut -d ' ' -f 1
        )"
        {
          echo "source=$source_dir"
          echo "home=$RUNNER_TEMP/nebensound-repo"
          echo "key=nebensound-repo-$RUNNER_OS-$RUNNER_ARCH-$fingerprint"
        } >> "$GITHUB_OUTPUT"

    - name: Look for a build of exactly this tool
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.tool.outputs.home }}
        key: ${{ steps.tool.outputs.key }}

    # With the default features alone, which make the program: the interface
    # is not among them, and a log needs no terminal library. The toolchain is
    # the one the tool pins, taken from its own rust-toolchain.toml rather than
    # repeated here.
    - name: Build the tool
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ steps.tool.outputs.source }}
      env:
        TOOL_HOME: ${{ steps.tool.outputs.home }}
      run: |
        set -euo pipefail
        rustup toolchain install
        cargo build --release --locked
        mkdir -p "$TOOL_HOME"
        cp target/release/nebensound-repo "$TOOL_HOME/nebensound-repo"

    # Several unit jobs can miss at once; the first to finish keeps its build,
    # and the others are told the key is taken, which fails nothing.
    - name: Keep the build for the next job
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.tool.outputs.home }}
        key: ${{ steps.tool.outputs.key }}

    - name: Put the tool on the PATH
      shell: bash
      env:
        TOOL_HOME: ${{ steps.tool.outputs.home }}
      run: |
        set -euo pipefail
        "$TOOL_HOME/nebensound-repo" --version
        echo "$TOOL_HOME" >> "$GITHUB_PATH"

    # Text from the repository goes into a step's log through three functions,
    # which every block written in shell and every step of nebensound.yml that
    # writes such text sources from the file NEBENSOUND_SHOWN names:
    #
    #   . "$NEBENSOUND_SHOWN"
    #
    # Git allows a line break in a tracked file name, and a value of the
    # declaration, a unit's path or the reason of an [[exclude]] entry, holds
    # whatever someone wrote. The runner reads a line of the log that starts
    # with `::`, after white space, as a workflow command, so such text written
    # out as it stands could add an annotation of its own or stop the workflow
    # commands of the step (`::stop-commands::`). `shown` therefore writes text
    # that holds a control character the way the tool writes it in its own
    # output: a line break as `\n`, a carriage return as `\r`, a tab as `\t`,
    # a backslash and a quote behind a backslash, and any other control
    # character as `\u{<hex>}`; every other character, and text without a
    # control character, stays as it is. A control character is one of
    # Unicode category Cc, as in the tool: bash's `[[:cntrl:]]` in the job's
    # UTF-8 locale names those, and the line and paragraph separators U+2028
    # and U+2029 besides, which `shown` therefore leaves as they are.
    # `shown_list` writes so every entry of what comes in on standard input,
    # each ended by a zero byte, one line each: a file list of
    # `nebensound-repo files -z`, or the output of jq with `--join-output` and
    # "\u0000" behind every line. A
    # workflow command a block writes holds no control character once it is
    # escaped, so it passes through unchanged.
    #
    # A path in a property of a workflow command, `file=` above all, goes
    # through the third function, `property`, instead: the runner reads `%0A`
    # there back as a line break, so the annotation stays on the real file,
    # and `:` and `,` cannot end the property early.
    #
    # The functions are written here, like every other piece of shell of the
    # blocks, rather than kept as a .sh file, which would need the shell
    # check, and that check has no block yet.
    - name: Write the functions that put text from the repository into a log
      shell: bash
      run: |
        set -euo pipefail
        file="$RUNNER_TEMP/nebensound-shown.sh"
        cat > "$file" <<'BASH'
        # shown TEXT: TEXT as one line of a step's log, without a line break
        # behind it. See the action tool of Nebensound/pipeline.
        shown() {
          local text="$1" out="" char code i
          if [[ "$text" != *[[:cntrl:]]* ]]; then
            printf '%s' "$text"
            return
          fi
          for ((i = 0; i < ${#text}; i++)); do
            char="${text:i:1}"
            case "$char" in
              $'\t') out+='\t' ;;
              $'\n') out+='\n' ;;
              $'\r') out+='\r' ;;
              \\ | \' | \") out+="\\$char" ;;
              # Not of category Cc, though glibc counts them as cntrl.
              $'\u2028' | $'\u2029') out+="$char" ;;
              [[:cntrl:]])
                printf -v code '%x' "'$char"
                out+="\\u{$code}"
                ;;
              *) out+="$char" ;;
            esac
          done
          printf '%s' "$out"
        }

        # shown_list: every entry of standard input, each ended by a zero
        # byte, as `shown` writes it, one line each.
        shown_list() {
          local entry
          while IFS= read -r -d '' entry; do
            shown "$entry"
            printf '\n'
          done
        }

        # property TEXT: TEXT as the value of a property of a workflow
        # command, `file=` above all, escaped the way the runner reads it
        # back, so that the annotation names the real file.
        property() {
          local value="$1"
          value="${value//%/%25}"
          value="${value//$'\r'/%0D}"
          value="${value//$'\n'/%0A}"
          value="${value//:/%3A}"
          value="${value//,/%2C}"
          printf '%s' "$value"
        }
        BASH
        echo "NEBENSOUND_SHOWN=$file" >> "$GITHUB_ENV"
