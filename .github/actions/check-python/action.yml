name: check-python
description: >-
  The Python check over one uv project: every Python file the unit holds is
  formatted the way Ruff writes it, passes Ruff and passes Pyright in strict
  mode; the tests pass with every line and branch covered; and the project's
  wheel installs into a clean environment, where its commands answer `--help`
  and its packages import.

# One input, and it is not a setting: where the unit is. It comes from the plan
# of phase 0. The calling job checks the repository out and puts the tool on
# the PATH first (the action `tool`); every step runs at the repository root.
#
# The check itself is the tool's: `nebensound-repo run python` takes the files
# `nebensound-repo files` names for the check and the unit, installs through uv
# the interpreter the project's .python-version names and the project as its
# uv.lock pins it, and runs every step in order, each in a group of the log. A
# file an `[[exclude]]` entry takes out is handed to no tool. It runs the same
# way on a developer's computer; the reference says what each step runs.

inputs:
  working-directory:
    description: The directory of the unit, as the plan names it.
    required: true

runs:
  using: composite
  steps:
    # The pinned version of every program the check calls, and the runtimes
    # Pyright and coverage.py run on where the runner has none that is new
    # enough: the register is the only place their versions and digests
    # stand, here as on a developer's computer. They go into the tool's folder
    # in the cache directory, outside the checkout, so that nothing of them
    # ends up in the tree being checked.
    - name: Set up the programs of the Python check
      shell: bash
      run: nebensound-repo setup --pinned --with-runtimes python

    - name: Every Python file passes the check
      shell: bash
      env:
        UNIT: ${{ inputs.working-directory }}
      run: nebensound-repo run python -- "$UNIT"
