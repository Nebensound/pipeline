[project]
name            = "sample"
version         = "0.0.0"
description     = "A command that greets someone."
requires-python = ">=3.14"
dependencies    = []

[project.scripts]
sample = "sample.cli:main"

[dependency-groups]
dev = ["pytest>=9.2"]

[tool.pytest.ini_options]
addopts = "-q --no-header"

[build-system]
requires      = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
