# The pipeline's default for yamllint: yamllint's own defaults, less what
# contradicts Prettier or GitHub Actions. `check-yaml` lays a repository's own
# configuration over it rule by rule, so the repository names only the rules
# it wants different, and a rule it does not name keeps the value given here,
# also after this file changes. The tool compiles it in to say which rules a
# repository sets differently.
extends: default

rules:
  # Prettier puts one space before a comment; the default asks for two.
  comments:
    min-spaces-from-content: 1
  # Prettier writes a flow mapping with one space inside the braces,
  # `{ required: true }`, and an empty one as `{}`; the default forbids the
  # spaces.
  braces:
    min-spaces-inside: 1
    max-spaces-inside: 1
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0
  # Prettier removes no `---` and adds none.
  document-start: disable
  # Prettier does not break a long scalar.
  line-length: disable
  # `on:` is a key in every workflow.
  truthy:
    check-keys: false
