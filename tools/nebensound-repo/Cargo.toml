# The tool `nebensound-repo`: what reads, resolves and checks a repository's
# `.nebensound/repo.toml`, for the tasks of that repository. It stands here and
# not at the root because the repository's product is the workflow and its
# building blocks; this is what they run.
#
# One package, a library and the program: one name, one version. What builds on
# it as a library switches the default features off and gets neither the
# downloads of `setup` nor the JSON Schema.
#
# No manifest carries a `version`: versions come from the history.
[package]
name         = "nebensound-repo"
description  = "Reads a repository, runs phase 0 on it and shows the result."
edition      = "2024"
rust-version = "1.98"
license      = "EUPL-1.2"
repository   = "https://github.com/Nebensound/pipeline"

# Not published. Whoever needs the tool gets it through the composite action; a
# second distribution channel would be a second version that can fall behind.
publish = false

# The crate `cargo package` builds leaves out the tests that hold this
# repository's documents in line with the tool: they read files outside the
# package (docs/), so they are tests of the source.
exclude = ["tests/declaration.rs", "tests/register_page.rs"]

# What `setup` needs to put a pinned program in place: sha2 holds a download
# against its digest, flate2 and tar unpack a .gz or .tar.gz build, zip a .zip
# build (Windows). The download itself goes through curl, so no HTTP or TLS
# library is linked. schemars derives the JSON Schema of the declaration.
# tempfile makes the folder `run` hands the programs their files in, and
# removes it again. All of them serve the program alone and come with the
# feature `program`.
[dependencies]
clap         = { version = "4", features = ["derive"] }
flate2       = { version = "1", optional = true }
globset      = "0.4"
ignore       = "0.4"
jsonc-parser = { version = "0.34", features = ["serde"] }
ratatui      = { version = "0.30", optional = true }
regex        = "1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
sha2         = { version = "0.10", optional = true }
tar          = { version = "0.4", default-features = false, optional = true }
tempfile     = { version = "3", optional = true }
thiserror    = "2"
toml         = "1"
toml_edit    = "0.25"
yaml-rust2   = "0.13"

[dependencies.schemars]
version          = "1"
default-features = false
features         = ["derive", "std"]
optional         = true

# Version 9 adds nix, zeroize and getrandom, with no feature to leave them out.
[dependencies.zip]
version          = "8"
default-features = false
features         = ["deflate-flate2"]
optional         = true

[dev-dependencies]
portable-pty = "0.9"
tempfile     = "3"

# `program` is what only the program needs: the downloading and unpacking of
# `setup`, the programs `run` starts, and the JSON Schema while the call
# `schema` exists. It is on by default, so that building and installing the
# tool take no flag.
#
# The interface is opt-in. The composite action builds without it, so a run of
# phase 0 compiles no terminal library; `--features ui` adds the `ui` call for
# walking the tree by hand.
[features]
default = ["program"]
program = [
  "dep:flate2",
  "dep:schemars",
  "dep:sha2",
  "dep:tar",
  "dep:tempfile",
  "dep:zip",
]
ui = ["dep:ratatui"]

[[bin]]
name              = "nebensound-repo"
path              = "src/main.rs"
required-features = ["program"]

# What only exists with the program or the interface is only built with it.
[[test]]
name              = "declaration"
required-features = ["program"]

[[test]]
name              = "schema"
required-features = ["program"]

[[test]]
name              = "run"
required-features = ["program"]

[[test]]
name              = "setup"
required-features = ["program"]

[[test]]
name              = "ui"
required-features = ["ui"]

[[test]]
name              = "pty"
required-features = ["program", "ui"]

[lints.rust]
missing_docs    = "deny"
unsafe_code     = "forbid"
unexpected_cfgs = "deny"

[lints.clippy]
all         = { level = "deny", priority = -1 }
pedantic    = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
