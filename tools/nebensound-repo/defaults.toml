# What every repository declares without writing it down.
#
# The same shape as any .nebensound/repo.toml, with one freedom more: here an
# exclusion may be a pattern. Centrally, work may be excused; locally it may
# only be added.

# The base set. What every repository is required to hold has to be checked
# everywhere as well. README and AGENTS bring Markdown, the workflows and issue
# forms YAML, repo.toml TOML, the lockfiles TOML or JSON.
# github-actions belongs here because every repository has workflows whose
# actions Dependabot has to keep current — the same construction as with the
# checks.
[repo.pipeline]
check      = ["markdown", "yaml", "json", "toml"]
dependabot = ["github-actions"]

# What nobody checks. A repository may pull an entry back in with `include`, but
# may not add one — otherwise it could excuse a whole language in a single line.
#
# A reason answers the question it raises: why does nobody look here? Naming the
# kind of file is not enough; what follows is the mechanism — binary, packed,
# generated, or no tool in the organization.

[[exclude]]
path   = "*.png"
reason = "image, binary; no tool has an opinion about it"

[[exclude]]
path   = "*.jpg"
reason = "image, binary; no tool has an opinion about it"

[[exclude]]
path   = "*.jpeg"
reason = "image, binary; no tool has an opinion about it"

[[exclude]]
path   = "*.gif"
reason = "image, binary; no tool has an opinion about it"

[[exclude]]
path   = "*.webp"
reason = "image, binary; no tool has an opinion about it"

[[exclude]]
path   = "*.svg"
reason = "image as source text; checkable, but without a formatter in the organization"

[[exclude]]
path   = "*.ico"
reason = "image, binary; no tool has an opinion about it"

[[exclude]]
path   = "*.pdf"
reason = "rendered result, not the source"

[[exclude]]
path   = "*.xlsx"
reason = "spreadsheet document; packed XML that no tool here opens"

[[exclude]]
path   = "*.docx"
reason = "text document; packed XML that no tool here opens"

[[exclude]]
path   = "*.odt"
reason = "text document; packed XML that no tool here opens"

[[exclude]]
path   = "*.woff"
reason = "font, binary; no tool has an opinion about it"

[[exclude]]
path   = "*.woff2"
reason = "font, binary; no tool has an opinion about it"

[[exclude]]
path   = "*.ttf"
reason = "font, binary; no tool has an opinion about it"

[[exclude]]
path   = "*.otf"
reason = "font, binary; no tool has an opinion about it"

[[exclude]]
path   = "*.zip"
reason = "archive; its content is reachable by no check"

[[exclude]]
path   = "*.gz"
reason = "archive; its content is reachable by no check"

[[exclude]]
path   = "*.tar"
reason = "archive; its content is reachable by no check"

[[exclude]]
path   = "*.bin"
reason = "binary artifact; not a source, and no tool reads it"

[[exclude]]
path   = "*.hex"
reason = "firmware image; a generated result, not the source"

[[exclude]]
path   = "*.elf"
reason = "firmware image; a generated result, not the source"

[[exclude]]
path   = "*.stl"
reason = "CAD geometry; partly readable as text, but without a tool in the organization"

[[exclude]]
path   = "*.step"
reason = "CAD geometry; partly readable as text, but without a tool in the organization"

[[exclude]]
path   = "*.gcode"
reason = "machine code; generated by the slicer, not written"

[[exclude]]
path   = "*.db"
reason = "database file, binary; no tool reads it"

# Files every repository is required to hold that carry no extension and that
# no tool has an opinion about. Without these lines every repository would trip
# over its own LICENSE.

[[exclude]]
path   = "**/LICENSE"
reason = "legal text, taken over unchanged"

[[exclude]]
path   = "**/NOTICE"
reason = "legal text, taken over unchanged"

[[exclude]]
path   = "**/CODEOWNERS"
reason = "a syntax of its own, read by GitHub; no formatter for it"

[[exclude]]
path   = "**/.gitignore"
reason = "tool configuration without a formatter"

[[exclude]]
path   = "**/.gitattributes"
reason = "tool configuration without a formatter"

[[exclude]]
path   = "**/.dockerignore"
reason = "tool configuration without a formatter"

[[exclude]]
path   = "**/.editorconfig"
reason = "tool configuration without a formatter"

[[exclude]]
path   = "**/yarn.lock"
reason = "lockfile in a format of its own; no tool in the organization checks it"

[[exclude]]
path   = "**/Gemfile.lock"
reason = "lockfile in a format of its own; no tool in the organization checks it"

[[exclude]]
path   = "**/justfile"
reason = "command list in a syntax of its own; no tool in the organization checks it"

[[exclude]]
path   = "**/Makefile"
reason = "command list in a syntax of its own; no tool in the organization checks it"

# A folder Git would drop for being empty is kept with a marker file. The
# marker holds nothing, so there is nothing to check; one that holds content is
# a file like any other, and only-if-empty takes the excuse away from it.

[[exclude]]
path          = "**/.gitkeep"
reason        = "an empty marker that keeps a folder"
only-if-empty = true

[[exclude]]
path          = "**/.keep"
reason        = "an empty marker that keeps a folder"
only-if-empty = true

# Two files every uv project holds. A package that ships its type hints marks
# itself with an empty py.typed (PEP 561); one with content marks partial stubs
# and is a file like any other. .python-version names the interpreter uv
# installs, and check-python requires it; a version number has no format to
# check.

[[exclude]]
path          = "**/py.typed"
reason        = "an empty marker of a typed package (PEP 561)"
only-if-empty = true

[[exclude]]
path   = "**/.python-version"
reason = "a version number read by uv; no tool has an opinion about its format"
