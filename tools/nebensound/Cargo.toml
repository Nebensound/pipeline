# The tool `nebensound`: what reads, resolves and checks a repository's
# `.nebensound/repo.toml`. It stands here and not at the root because the
# repository's product is the workflow and its building blocks; this is what
# they run.
#
# The tool is the root of the workspace, not one of several packages inside it.
# Below crates/ lies what carries a version of its own and could be published
# separately: today the library that understands the declaration. The packages
# share one lockfile, so the tool builds against exactly the versions the
# library was checked against, and one set of lints, so it does not stand as a
# copy in every manifest.
#
# No manifest carries a `version`: versions come from tags.
[package]
name        = "nebensound"
description = "Reads a repository, runs phase 0 on it and shows the result."

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

# Not a package. Whoever needs the tool gets it through the composite action; a
# second distribution channel would be a second version that can fall behind.
publish = false

# What `setup` needs to put a pinned program in place: sha2 holds a download
# against its digest, flate2 and tar unpack a .gz or .tar.gz build, zip a .zip
# build (Windows). The download itself goes through curl, so no HTTP or TLS
# library is linked.
[dependencies]
nebensound-declaration = { path = "crates/nebensound-declaration", features = [
  "json-schema",
] }

clap.workspace         = true
flate2.workspace       = true
globset.workspace      = true
ignore.workspace       = true
jsonc-parser.workspace = true
ratatui                = { workspace = true, optional = true }
regex.workspace        = true
serde.workspace        = true
serde_json.workspace   = true
sha2.workspace         = true
tar.workspace          = true
thiserror.workspace    = true
toml.workspace         = true
toml_edit.workspace    = true
yaml-rust2.workspace   = true
zip.workspace          = true

[dev-dependencies]
# The library once more, so the tests can build an analysis without a disk; the
# tool itself does not pass it on.
nebensound-declaration = { path = "crates/nebensound-declaration" }

portable-pty.workspace = true
tempfile.workspace     = true

# The interface is opt-in. The composite action builds without it, so a run of
# phase 0 compiles no terminal library; `--features ui` adds the `ui` call for
# walking the tree by hand.
[features]
default = []
ui      = ["dep:ratatui"]

# What only exists with the interface is only built with it.
[[test]]
name              = "ui"
required-features = ["ui"]

[[test]]
name              = "pty"
required-features = ["ui"]

[lints]
workspace = true

[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
edition      = "2024"
rust-version = "1.98"
license      = "EUPL-1.2"
repository   = "https://github.com/Nebensound/pipeline"

[workspace.dependencies]
clap         = { version = "4", features = ["derive"] }
flate2       = "1"
globset      = "0.4"
ignore       = "0.4"
jsonc-parser = { version = "0.34", features = ["serde"] }
portable-pty = "0.9"
ratatui      = "0.30"
regex        = "1"
schemars     = { version = "1", default-features = false, features = ["derive", "std"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
sha2         = "0.10"
tar          = { version = "0.4", default-features = false }
tempfile     = "3"
thiserror    = "2"
toml         = "1"
toml_edit    = "0.25"
yaml-rust2   = "0.13"
# Version 9 adds nix, zeroize and getrandom, with no feature to leave them out.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
missing_docs    = "deny"
unsafe_code     = "forbid"
unexpected_cfgs = "deny"

[workspace.lints.clippy]
all         = { level = "deny", priority = -1 }
pedantic    = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
