[package]
name        = "nebensound-declaration"
description = "Reads, resolves and checks the .nebensound/repo.toml that every Nebensound repository carries."

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

# register.toml and defaults.toml are compiled into the library, and the package
# smoke test builds from the unpacked package — so both have to travel along.
include = ["src/**", "tests/**", "register.toml", "defaults.toml", "Cargo.toml"]

[dependencies]
schemars            = { workspace = true, optional = true }
serde.workspace     = true
thiserror.workspace = true
toml.workspace      = true
toml_edit.workspace = true

# The JSON Schema of `.nebensound/repo.toml`, derived from the types that read
# it. Off by default: a consumer that only reads declarations compiles no
# schema generator. The tool switches it on for `nebensound schema`.
[features]
default     = []
json-schema = ["dep:schemars"]

[lints]
workspace = true
