# The pipeline's default for Stylelint: stylelint-config-standard, and for SCSS
# its counterpart stylelint-config-standard-scss, read with postcss-scss.
# `nebensound-repo run css` lays a repository's own configuration over it rule
# by rule, so the repository names only the rules it wants different, and a rule
# it does not name keeps the value set here, also after this file changes. The
# tool compiles it in, to hand it to Stylelint and to say which rules a
# repository sets differently. It reads `extends`, `customSyntax` and `rules`,
# here and in an entry of `overrides`, and hands Stylelint every package named
# here by its place in the pinned install, which only the packages the register
# pins with Stylelint can be.
extends:
  - stylelint-config-standard

overrides:
  - files:
      - "**/*.scss"
    customSyntax: postcss-scss
    extends:
      - stylelint-config-standard-scss
