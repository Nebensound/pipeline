#:schema https://raw.githubusercontent.com/Nebensound/pipeline/main/.github/actions/check-toml/schemas/nebensound-declaration.json

# The declaration of this repository: what it consists of and what the pipeline
# does with it. The pipeline reads it in every run and checks it against the
# tree. "none" applies no preset: what is built is named per unit below, and
# nothing is published.
#
# Every field is described in
# https://github.com/Nebensound/pipeline/blob/main/docs/declaration.md

[repo]
pipeline = "none"

# The tool that reads a declaration, the root of its Cargo workspace. It is a
# unit of its own because Cargo resolves here: the rust check runs here and
# Dependabot watches the lockfile here. It carries a version, which every run
# writes into its manifest with the version writer cargo before the package
# test of the rust check and before its build: on a pull request the version
# its merge would get. A run that touches it builds its crate with
# cargo-package and hands it on as an artifact of the run. Nothing publishes
# it.
[component.nebensound]
path = "tools/nebensound"

[component.nebensound.pipeline]
version    = ["cargo"]
check      = ["rust"]
build      = "cargo-package"
publish    = false
dependabot = ["cargo"]

# The library that understands a declaration, inside that workspace. The tool
# depends on it by path, so it carries a version of its own as well: a package
# that gets a version requires one of each path dependency. The package test
# builds and tests it as it would be published, and a run that touches it
# builds its crate with cargo-package and hands it on as an artifact of the
# run. The workspace above runs the check and watches the lockfile. Nothing
# publishes it.
[component.nebensound-declaration]
path     = "tools/nebensound/crates/nebensound-declaration"
pipeline = { version = ["cargo"], build = "cargo-package", publish = false }

# The xtask of this repository, a Cargo workspace of its own for the same
# reason. Phase 0 demands that it runs the rust check like any other Rust code.
[component.xtask]
path       = "xtask"
pipeline   = "rust-workspace"
versioning = "none"

# The test cases of the building blocks. Each is a small repository of its own
# that `cargo xtask check` hands to its block; a failing case is wrong on
# purpose, and a passing one is judged by its block alone. Each check-rust and
# build-cargo-package case is a whole Cargo package, the only way Rust code can
# be excluded.
[[exclude]]
path   = ".github/actions/build-cargo-package/tests"
reason = "test cases of build-cargo-package, whole Cargo packages judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/check-json/tests"
reason = "test cases of check-json, judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/check-markdown/tests"
reason = "test cases of check-markdown, judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/check-rust/tests"
reason = "test cases of check-rust, whole Cargo packages judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/check-toml/tests"
reason = "test cases of check-toml, judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/check-yaml/tests"
reason = "test cases of check-yaml, judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/version-cargo/tests"
reason = "test cases of version-cargo, judged by that block through the xtask; the failing ones are wrong on purpose"
