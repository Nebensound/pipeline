#:schema https://raw.githubusercontent.com/Nebensound/pipeline/main/schemas/nebensound-declaration.json

# The declaration of this repository: what it consists of and what the pipeline
# does with it. The pipeline reads it in every run and checks it against the
# tree. The repository is open source of the organization, so its audience is
# "public".
#
# Every field is described in
# https://github.com/Nebensound/pipeline/blob/main/docs/declaration.md

# The repository is the tool that reads a declaration, nebensound-repo: the
# package at the root, a library and the program, and the root of the one Cargo
# workspace, with the xtask of this repository as its other member. The
# repository's version is the tool's: the version writer cargo writes it into
# the root Cargo.toml, the rust check runs over the workspace, xtask included,
# and Dependabot watches the one lockfile.
#
# The preset rust-binary: its build cargo-release builds the tool for every
# target of the register, each on a runner of its own, and starts it there, and
# its target release-assets attaches the archives to the repository's release
# before it is published.
[repo]
audience = "public"
pipeline = "rust-binary"

# The test cases of the building blocks. Each is a small repository of its own
# that `cargo xtask check` hands to its block; a failing case is wrong on
# purpose, and a passing one is judged by its block alone. Each check-rust,
# build-cargo-package and build-cargo-release case is a whole Cargo package, the
# only way Rust code can be excluded.
[[exclude]]
path   = ".github/actions/build-cargo-package/tests"
reason = "test cases of build-cargo-package, whole Cargo packages judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/build-cargo-release/tests"
reason = "test cases of build-cargo-release, whole Cargo packages judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/build-docker/tests"
reason = "test cases of build-docker, judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/check-css/tests"
reason = "test cases of check-css, judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/check-dockerfile/tests"
reason = "test cases of check-dockerfile, judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/check-html/tests"
reason = "test cases of check-html, judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/check-json/tests"
reason = "test cases of check-json, judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/check-markdown/tests"
reason = "test cases of check-markdown, judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/check-python/tests"
reason = "test cases of check-python, uv projects judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/check-rust/tests"
reason = "test cases of check-rust, whole Cargo packages judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/check-toml/tests"
reason = "test cases of check-toml, judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/check-yaml/tests"
reason = "test cases of check-yaml, judged by that block through the xtask; the failing ones are wrong on purpose"

[[exclude]]
path   = ".github/actions/version-cargo/tests"
reason = "test cases of version-cargo, judged by that block through the xtask; the failing ones are wrong on purpose"
