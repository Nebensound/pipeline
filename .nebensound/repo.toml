#:schema https://raw.githubusercontent.com/Nebensound/pipeline/main/.github/actions/check-toml/schemas/nebensound-declaration.json

# The declaration of this repository: what it consists of and what the pipeline
# does with it. The pipeline reads it in every run and checks it against the
# tree. "none" applies no preset: nothing here is built or published.
#
# Every field is described in
# https://github.com/Nebensound/pipeline/blob/main/docs/declaration.md

[repo]
pipeline = "none"

# The Cargo workspace of the tool that reads a declaration. It is a unit of its
# own because Cargo resolves here: the rust check runs here and Dependabot
# watches the lockfile here. Nothing in it is built or published yet, so it
# carries no version.
[component.nebensound]
path       = "tools/nebensound"
pipeline   = "rust-workspace"
versioning = "none"

[[exclude]]
path   = "tools/nebensound/crates/evidence-a"
reason = "evidence for #10: a workspace member that stands for a vendored copy"

[[include]]
path   = "tools/nebensound/crates/evidence-a/inner"
reason = "evidence for #10: a package inside the excluded one, kept in"
