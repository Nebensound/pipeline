# The programs the checks and builds call, each pinned to the version its
# building block installs, and where that version comes from on each platform:
# a build per operating system and architecture, or, for a program on a
# runtime, its one package, which the runtime's installer puts in place. Every
# download carries the digest its publisher states for it, in the release data
# named beside it; a download with another digest is refused.
# `nebensound-repo setup` reads this.
#
# A platform without an entry has no pinned build: there only the computer's
# copy can be used. The default mode of `nebensound-repo setup` takes it from the
# `PATH`; `nebensound-repo setup --pinned` fails for the program.
#
# A program on a runtime names the lowest version of the runtime it runs on
# (`runtime-minimum`), as its package states it: `requires_python` on PyPI,
# `engines.node` on npm. A runtime on the computer below it counts as missing.

