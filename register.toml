# The vocabulary: which version writers, checks, builds, targets and presets
# exist, and what a check covers. Definitions, not statements about a
# repository — what every repository declares anyway stands beside this in
# defaults.toml.
#
# Compiled in so that no repository holds a version that can fall behind.
# Adopting a change means raising the crate.

# The version writers: each receives a unit's canonical .nebensound version as a
# derived copy. How the copy is written is the knowledge of the building block
# version-<name>, not of this file; an entry makes the name one a pipeline may
# select, and says in words what it writes.

[version.cargo]
copy = "the package version in the unit's Cargo.toml, written through Cargo"

[version.asciidoc]
copy = "the :revnumber: attribute in the unit's AsciiDoc source document"

# A check names the programs it calls; each stands under [program.*] below,
# pinned.
[check.markdown]
extensions = [".md", ".markdown"]
programs   = ["lychee", "markdownlint-cli2", "prettier"]

[check.yaml]
extensions = [".yml", ".yaml"]
programs   = ["actionlint", "prettier"]

# Lockfiles are named, never covered by the extension `.lock`: the extension is
# shared by formats that have nothing in common. composer.lock, flake.lock and
# Pipfile.lock are JSON; Cargo.lock, uv.lock, poetry.lock and pdm.lock are
# TOML; yarn.lock and Gemfile.lock are in formats of their own and stand on the
# list of types nobody checks, in defaults.toml. Pipfile is TOML without an
# extension and no lockfile, so it is linted and formatted like a .toml file.
[check.json]
extensions = [".json", ".jsonc", ".geojson"]
filenames  = ["composer.lock", "flake.lock", "Pipfile.lock"]
programs   = ["prettier"]

[check.toml]
extensions = [".toml"]
filenames  = ["Cargo.lock", "uv.lock", "poetry.lock", "pdm.lock", "Pipfile"]
programs   = ["taplo"]

# The toolchain, rustfmt and Clippy are the ones the workspace pins in its
# rust-toolchain.toml, and rustup provides them; only what comes on top is
# pinned here: cargo-llvm-cov, and the nightly toolchain coverage is measured
# on, pinned by date, since only there does `#[coverage(off)]` take effect.
# The tool installs both toolchains through rustup.
[check.rust]
extensions         = [".rs"]
programs           = ["cargo-llvm-cov"]
coverage-toolchain = "nightly-2026-11-14"

# uv installs the interpreter the project's .python-version names and the
# project as its uv.lock pins it; pytest and its plugins come from that lock,
# since they have to import the project's code. Only what comes on top is
# pinned here.
[check.python]
extensions = [".py", ".pyi"]
programs   = ["coverage", "pyright", "ruff", "uv"]

[check.cpp]
extensions = [".c", ".h", ".cpp", ".hpp", ".cc", ".hh", ".cxx", ".ino"]

[check.javascript]
extensions = [".js", ".mjs", ".cjs", ".jsx", ".ts", ".tsx"]

[check.php]
extensions = [".php"]

[check.r]
extensions = [".r"]

[check.shell]
extensions = [".sh", ".bash"]

[check.sql]
extensions = [".sql"]

[check.qml]
extensions = [".qml"]

[check.html]
extensions = [".html", ".htm"]
programs   = ["html-validate", "lychee", "prettier"]

# `.scss` is linted with the SCSS counterpart of the standard configuration,
# which the program entry of Stylelint brings along.
[check.css]
extensions = [".css", ".scss"]
programs   = ["prettier", "stylelint"]

[check.asciidoc]
extensions = [".adoc", ".asciidoc"]

[check.typst]
extensions = [".typ"]

# The one check that cannot work from extensions: a Dockerfile has none.
[check.dockerfile]
extensions = [".dockerfile"]
filenames  = ["Dockerfile", "Containerfile"]
programs   = ["dockerfmt", "hadolint"]

# A build names the version writers it needs: what it produces carries the
# version they write, and without them it would carry whatever version the
# sources hold. A crate takes its version from Cargo.toml, so `cargo-package`
# needs the writer `cargo`.
[build.cargo-package]
produces         = "crate"
requires-version = ["cargo"]

[build.cargo-release]
produces = "executable"

# The image is scanned for vulnerabilities before it is handed on, and the
# scanner is pinned like any program a check calls. A build names the files it
# reads below the unit's path and fails without: the image is built from
# deploy/Dockerfile and from nothing else. It is built by a BuildKit of its own,
# started from the image pinned under [image.buildkit].
[build.docker]
produces      = "container"
requires-file = ["deploy/Dockerfile"]
programs      = ["trivy"]
images        = ["buildkit"]

[build.platformio]
produces = "firmware"

[build.esphome]
produces = "firmware"

[build.asciidoctor]
produces = "site"

[build.typst]
produces = "document"

# A target is a registry when the packages published there require each other
# by version (`dependencies-by-version`): the registry resolves a requirement
# from the versions it holds. What a package published there requires by path,
# and a pull request does not touch, must have a release already, or the pull
# request fails with `unreleased-requirement`. The tool knows this from here,
# never from a target's name.
#
# The organization's private crate registry. The register names no host: which
# registry that is reaches the pipeline through organization-level settings,
# not through this repository or a calling repository.
[target.private-registry]
accepts                 = ["crate"]
dependencies-by-version = true

# Publishing here cannot be taken back, so it is the one target that also
# demands the language match.
[target."crates.io"]
accepts                 = ["crate"]
requires-check          = "rust"
dependencies-by-version = true

[target.release-assets]
accepts = ["executable", "firmware", "document"]

[target.ghcr]
accepts = ["container"]

[target.pages]
accepts = ["site"]

[preset.none]
check   = []
publish = false

# The workspace side, when it needs a pipeline of its own: it runs the check and
# watches the lockfile, and has no product to build or publish. A workspace that
# is the product itself takes the product preset instead.
[preset.rust-workspace]
check      = ["rust"]
publish    = false
dependabot = ["cargo"]

# A workspace whose packages carry versions of their own has three boundaries:
# the workspace is checked, the package is published, and Dependabot works where
# resolution happens — so at the workspace again.

# The package side: one independently released library package inside a
# workspace. The name refers to the Cargo package and its release boundary.
#
# It carries a **version of its own**, and that is the reason for the split. A
# version is a promise to the consumer; were it shared with its siblings, every
# release would claim a change that did not happen — and every consuming
# repository would get a Dependabot pull request for it. Whoever waves three
# empty bumps through waves the fourth through as well.
#
# No check: the workspace runs it, and it is enough that *one* containing unit
# runs it. No dependabot: resolution happens at the root.
[preset.rust-library-package]
version    = ["cargo"]
check      = []
build      = "cargo-package"
publish    = ["private-registry"]
dependabot = []

[preset.rust-library-public-package]
version    = ["cargo"]
check      = []
build      = "cargo-package"
publish    = ["crates.io"]
dependabot = []

# The default for a library: the organization's private registry, and nothing
# else.
[preset.rust-library]
version    = ["cargo"]
check      = ["rust"]
build      = "cargo-package"
publish    = ["private-registry"]
dependabot = ["cargo"]

# The same library, published where it cannot be taken back. crates.io keeps a
# yanked version readable forever, so this is a separate preset rather than an
# extra target on the one above: publishing publicly is a decision someone
# makes by name, not a list that grew by one entry.
#
# It does not also publish to the private registry. A crate that is on
# crates.io is resolvable from there for everyone, and a second copy would only
# raise the question which of the two is the real one.
[preset.rust-library-public]
version    = ["cargo"]
check      = ["rust"]
build      = "cargo-package"
publish    = ["crates.io"]
dependabot = ["cargo"]

[preset.rust-binary]
version    = ["cargo"]
check      = ["rust"]
build      = "cargo-release"
publish    = ["release-assets"]
dependabot = ["cargo"]

# A service checks its Rust sources and its Dockerfiles. The docker build
# produces the deployable container; the release binary the rust check builds is
# no second artifact.
[preset.rust-service]
version    = ["cargo"]
check      = ["rust", "dockerfile"]
build      = "docker"
publish    = ["ghcr"]
dependabot = ["cargo", "docker"]

[preset.python-service]
check      = ["python", "dockerfile"]
build      = "docker"
publish    = ["ghcr"]
dependabot = ["uv", "docker"]

[preset.platformio-firmware]
check      = ["cpp"]
build      = "platformio"
publish    = ["release-assets"]
dependabot = []

[preset.esphome-firmware]
check      = ["yaml"]
build      = "esphome"
publish    = ["release-assets"]
dependabot = []

[preset.asciidoc-site]
version    = ["asciidoc"]
check      = ["asciidoc"]
build      = "asciidoctor"
publish    = ["pages"]
dependabot = []

[preset.typst-document]
check      = ["typst"]
build      = "typst"
publish    = ["release-assets"]
dependabot = []

# The package ecosystems Dependabot can watch. `manifests` names the files one
# is recognized by in the tree — that is what phase 0 measures a present
# manifest against to see whether it is watched.
#
# Where a language has several package managers, each one stands here for
# itself; which one holds is said by the pipeline. The presets name the one the
# organization has chosen.

# Cargo.lock, not Cargo.toml: Dependabot works on the directory where
# resolution happens. In a workspace that is the root, and a member has nothing
# of its own — counting its Cargo.toml as a manifest would mean taking every
# package for an ecosystem of its own.
#
# The lockfile of a Cargo.toml is the Cargo.lock in the root of the workspace
# its package belongs to; phase 0 warns when Git does not track it. Its name is
# one a check above covers: what a lockfile is, is said there, and an ecosystem
# that names another is refused.
[ecosystem.cargo]
package-ecosystem = "cargo"
manifests         = ["Cargo.lock"]
lockfile          = { manifest = "Cargo.toml", name = "Cargo.lock", stands = "cargo-workspace-root" }

[ecosystem.uv]
package-ecosystem = "uv"
manifests         = ["uv.lock"]

[ecosystem.pip]
package-ecosystem = "pip"
manifests         = ["requirements.txt"]

[ecosystem.npm]
package-ecosystem = "npm"
manifests         = ["package-lock.json"]

[ecosystem.docker]
package-ecosystem = "docker"
manifests         = ["Dockerfile", "Containerfile"]

[ecosystem.github-actions]
package-ecosystem = "github-actions"
manifests         = []

# The container images a build starts, each pinned by the digest the registry
# states for its tag; it is pulled by that digest, so the tag only says which
# version it is.

# The digest Docker Hub states for moby/buildkit:v0.34.2.
[image.buildkit]
repository = "moby/buildkit"
tag        = "v0.34.2"
